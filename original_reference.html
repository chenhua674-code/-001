<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>鬼新娘 - 技能成长版</title>
<style>
body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
canvas { display: block; background: #050510; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; color: white; font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px black; }
#hud-left, #hud-right { display: flex; flex-direction: column; gap: 4px; }
#hud-right { text-align: right; }
#hp-bar-container { position: absolute; bottom: 20px; left: 5%; width: 90%; height: 16px; }
#hp-bar-bg { width: 100%; height: 12px; background: #333; border: 2px solid #555; border-radius: 6px; overflow: hidden; }
#hp-bar-fill { height: 100%; background: linear-gradient(90deg, #ff3333, #ff6644); width: 100%; transition: width 0.1s; }
#hp-text { text-align: center; color: #fff; font-size: 12px; margin-bottom: 2px; }
#xp-bar-container { position: absolute; bottom: 44px; left: 5%; width: 90%; height: 14px; }
#xp-bar-bg { width: 100%; height: 10px; background: #222; border: 1px solid #444; border-radius: 5px; overflow: hidden; }
#xp-bar-fill { height: 100%; background: linear-gradient(90deg, #44aaff, #00ff88); width: 0%; transition: width 0.2s; }
#xp-text { text-align: center; color: #44aaff; font-size: 11px; margin-bottom: 1px; }
#boss-hp-container { position: absolute; top: 45px; left: 5%; width: 90%; height: 20px; }
#boss-name { text-align: center; color: #ff3333; font-size: 16px; margin-bottom: 2px; text-shadow: 0 0 5px red; }
#boss-hp-bg { width: 100%; height: 12px; background: #333; border: 2px solid #555; border-radius: 6px; overflow: hidden; }
#boss-hp-fill { height: 100%; background: linear-gradient(90deg, #ff0000, #ff6600); width: 100%; transition: width 0.1s; }
#skill-menu { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); pointer-events: auto; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); z-index: 100; }
.skill-card { width: 85%; max-width: 400px; background: linear-gradient(135deg, #222, #111); border: 2px solid #444; color: white; padding: 15px; margin: 8px 0; border-radius: 12px; display: flex; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.skill-card:active { transform: scale(0.98); }
.skill-card.new-skill { border-color: #00ff88; }
.skill-card.upgrade-skill { border-color: #ffd700; }
.skill-icon { font-size: 32px; margin-right: 15px; min-width: 40px; text-align: center; }
.skill-info h3 { margin: 0; color: #00ffff; font-size: 18px; }
.skill-info p { margin: 4px 0 0; color: #aaa; font-size: 14px; }
.skill-level-tag { color: #ffd700; font-size: 12px; margin-left: auto; padding-left: 10px; }
#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); pointer-events: auto; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 200; }
#restart { padding: 15px 40px; background: #ff3333; border: none; color: white; font-size: 20px; border-radius: 8px; margin-top: 20px; cursor: pointer; }
#skills-hud { position: absolute; bottom: 65px; left: 5%; display: flex; gap: 6px; flex-wrap: wrap; }
.skill-badge { background: rgba(0,0,0,0.6); border: 1px solid #555; border-radius: 8px; padding: 3px 8px; color: #fff; font-size: 12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
    <div id="hud">
        <div id="hud-left">
            <span>🏆 <span id="score">0</span></span>
            <span>⭐ Lv.<span id="level">1</span></span>
        </div>
        <div id="hud-right">
            <span>⏱️ <span id="time">00:00</span></span>
            <span>🌊 波次 <span id="wave">1</span></span>
        </div>
    </div>
    
    <div id="boss-hp-container">
        <div id="boss-name">🐍 鬼新娘长龙</div>
        <div id="boss-hp-bg"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="xp-bar-container">
        <div id="xp-text">经验 0/100</div>
        <div id="xp-bar-bg"><div id="xp-bar-fill"></div></div>
    </div>

    <div id="hp-bar-container">
        <div id="hp-text">HP 1000/1000</div>
        <div id="hp-bar-bg"><div id="hp-bar-fill"></div></div>
    </div>

    <div id="skills-hud"></div>

    <div id="skill-menu">
        <h2 style="color: #00ff88; text-shadow: 0 0 10px #00ff88; margin-bottom: 5px;">⬆️ 升级! 选择强化</h2>
        <p style="color: #888; margin-bottom: 15px; font-size: 14px;" id="upgrade-subtitle">等级 2</p>
        <div id="skills-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <div id="game-over">
        <h1 style="color: #ff3333; font-size: 40px; text-shadow: 0 0 10px red;">💀 防线崩溃</h1>
        <p style="font-size: 20px;">最终分数: <span id="final-score" style="color: #00ff88">0</span></p>
        <p style="font-size: 16px; color: #aaa;">等级: <span id="final-level">1</span> | 波次: <span id="final-wave">1</span></p>
        <button id="restart" onclick="restartGame()">不服再来</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();
initGame(); // W/H 有值后初始化游戏

// ==================== 技能池 ====================
const SKILLS = [
    { id: 'damage', name: '鬼火弹', icon: '🔥', desc: '子弹伤害 +30%', color: '#ff4444', apply: () => { player.damage = Math.floor(player.damage * 1.3); }},
    { id: 'fireRate', name: '速射', icon: '⚡', desc: '射速 +20%', color: '#ffff44', apply: () => { player.fireRate = Math.max(5, Math.floor(player.fireRate * 0.8)); }},
    { id: 'bulletCount', name: '散射', icon: '🌀', desc: '子弹数 +1', color: '#44ffff', apply: () => { player.bulletCount += 1; }},
    { id: 'pierce', name: '穿透', icon: '💎', desc: '穿透 +1', color: '#ff44ff', apply: () => { player.pierce += 1; }},
    { id: 'angel', name: '天使助攻', icon: '👼', desc: '召唤天使助手', color: '#ffffaa', apply: () => { player.hasAngel = true; player.angelCount += 1; }},
    { id: 'crit', name: '暴击', icon: '💥', desc: '20%几率 2.5x 暴击', color: '#ff8800', apply: () => { player.critRate += 0.2; player.critMult += 0.5; }},
    { id: 'maxHp', name: '生命强化', icon: '❤️', desc: '最大HP +300, 回复满', color: '#ff4466', apply: () => { player.maxHp += 300; player.hp = Math.min(player.hp + 300, player.maxHp); }},
    { id: 'regen', name: '生命回复', icon: '💚', desc: '每秒回复 20 HP', color: '#44ff44', apply: () => { player.regenPerSec += 20; }},
    { id: 'speed', name: '移速提升', icon: '🏃', desc: '移动速度 +25%', color: '#44aaff', apply: () => { player.moveSpeed *= 1.25; }},
    { id: 'lifesteal', name: '吸血', icon: '🩸', desc: '造成伤害的 10% 转化为生命', color: '#cc0044', apply: () => { player.lifesteal += 0.1; }},
    { id: 'explosive', name: '爆炸弹', icon: '💣', desc: '子弹命中产生爆炸溅射', color: '#ff6600', apply: () => { player.explosive = true; player.explosiveRadius = (player.explosiveRadius || 0) + 20; }},
    { id: 'slow', name: '冰霜', icon: '❄️', desc: '命中减速Boss 30%', color: '#aaddff', apply: () => { player.slowAmount += 0.3; player.slowDuration += 500; }},
];

// ==================== 游戏状态 ====================
let gameState = 'playing';
let score = 0;
let time = 0;
let screenShake = 0;
let wave = 1;
let pendingXpOrbs = [];
let xpOrbs = [];
let isPaused = false;
let regenTimer = 0;
let gameInitialized = false;

const player = {
    x: 0, y: 0,
    radius: 30,
    hp: 1000, maxHp: 1000,
    damage: 50,
    fireRate: 25, fireTimer: 0,
    level: 1, xp: 0, xpToNext: 100,
    bulletCount: 1, pierce: 0,
    hasAngel: false, angelCount: 0,
    critRate: 0, critMult: 2.5,
    regenPerSec: 0,
    moveSpeed: 1,
    lifesteal: 0,
    explosive: false, explosiveRadius: 0,
    slowAmount: 0, slowDuration: 0,
    skills: {}, // { skillId: level }
};

let bullets = [];
let boss = null;
let angels = [];
let particles = [];
let damageNums = [];
let explosions = [];

// 输入控制
let inputX = 0;
const keys = {};

function initGame() {
    if (gameInitialized) return;
    gameInitialized = true;
    
    player.x = W / 2;
    player.y = H - 80;
    inputX = W / 2;
    
    updateXpBar();
    updateHpBar();
}

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);
window.addEventListener('mousemove', e => inputX = e.clientX);
window.addEventListener('touchmove', e => {
    if(e.touches.length > 0) inputX = e.touches[0].clientX;
}, {passive: true});

// ==================== 升级系统 ====================
function addXp(amount) {
    player.xp += amount;
    while (player.xp >= player.xpToNext) {
        player.xp -= player.xpToNext;
        player.level++;
        player.xpToNext = Math.floor(player.xpToNext * 1.4);
        showLevelUp();
    }
    updateXpBar();
}

function showLevelUp() {
    isPaused = true;
    gameState = 'levelup';
    
    // 选3个随机技能
    let options = getRandomSkillOptions(3);
    
    const menu = document.getElementById('skill-menu');
    const container = document.getElementById('skills-container');
    document.getElementById('upgrade-subtitle').textContent = `等级 ${player.level}`;
    
    container.innerHTML = '';
    options.forEach(opt => {
        const card = document.createElement('div');
        const isNew = !player.skills[opt.id];
        const lvl = player.skills[opt.id] || 0;
        card.className = `skill-card ${isNew ? 'new-skill' : 'upgrade-skill'}`;
        card.innerHTML = `
            <div class="skill-icon">${opt.icon}</div>
            <div class="skill-info">
                <h3>${isNew ? '🆕 ' : '⬆️ '}${opt.name}</h3>
                <p>${opt.desc}</p>
            </div>
            <div class="skill-level-tag">${isNew ? '新技能' : `Lv.${lvl} → Lv.${lvl+1}`}</div>
        `;
        card.onclick = () => selectSkill(opt);
        container.appendChild(card);
    });
    
    menu.style.display = 'flex';
}

function getRandomSkillOptions(count) {
    // 优先已有的技能（升级），其次新技能
    let owned = Object.keys(player.skills);
    let pool = [];
    
    // 50% 概率选已有技能
    if (owned.length > 0 && Math.random() < 0.5) {
        pool.push(SKILLS.find(s => s.id === owned[Math.floor(Math.random() * owned.length)]));
    }
    
    // 其余从全部技能中随机
    let available = SKILLS.filter(s => !pool.includes(s));
    shuffle(available);
    while (pool.length < count && available.length > 0) {
        pool.push(available.pop());
    }
    
    return pool.slice(0, count);
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function selectSkill(skill) {
    if (!player.skills[skill.id]) player.skills[skill.id] = 0;
    player.skills[skill.id]++;
    
    skill.apply();
    
    document.getElementById('skill-menu').style.display = 'none';
    gameState = 'playing';
    isPaused = false;
    
    updateSkillsHud();
}

function updateXpBar() {
    const pct = (player.xp / player.xpToNext) * 100;
    document.getElementById('xp-bar-fill').style.width = pct + '%';
    document.getElementById('xp-text').textContent = `经验 ${player.xp}/${player.xpToNext}`;
    document.getElementById('level').textContent = player.level;
}

function updateHpBar() {
    const pct = (player.hp / player.maxHp) * 100;
    document.getElementById('hp-bar-fill').style.width = pct + '%';
    document.getElementById('hp-text').textContent = `HP ${Math.floor(player.hp)}/${player.maxHp}`;
}

function updateSkillsHud() {
    const container = document.getElementById('skills-hud');
    let html = '';
    for (const [id, lvl] of Object.entries(player.skills)) {
        const s = SKILLS.find(sk => sk.id === id);
        if (s) html += `<span class="skill-badge" style="border-color:${s.color}">${s.icon} Lv.${lvl}</span>`;
    }
    container.innerHTML = html;
}

// ==================== 经验球 ====================
function spawnXpOrbs(x, y, amount) {
    for (let i = 0; i < amount; i++) {
        xpOrbs.push({
            x: x + (Math.random() - 0.5) * 60,
            y: y + (Math.random() - 0.5) * 60,
            value: Math.ceil(player.xpToNext / (amount * 2)),
            life: 300,
            attracted: false,
            vx: 0, vy: 0
        });
    }
}

function updateXpOrbs() {
    for (let i = xpOrbs.length - 1; i >= 0; i--) {
        const orb = xpOrbs[i];
        orb.life--;
        if (orb.life <= 0) { xpOrbs.splice(i, 1); continue; }
        
        // 自动吸引：距离玩家150px内
        const d = Math.hypot(orb.x - player.x, orb.y - player.y);
        if (d < 150 || orb.attracted) {
            orb.attracted = true;
            const angle = Math.atan2(player.y - orb.y, player.x - orb.x);
            const speed = 6;
            orb.x += Math.cos(angle) * speed;
            orb.y += Math.sin(angle) * speed;
            
            if (d < 20) {
                addXp(orb.value);
                xpOrbs.splice(i, 1);
            }
        }
    }
}

function drawXpOrbs() {
    for (const orb of xpOrbs) {
        const alpha = orb.life < 60 ? orb.life / 60 : 1;
        ctx.globalAlpha = alpha;
        
        // Glowing orb
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Inner bright core
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        
        ctx.globalAlpha = 1;
    }
}

// ==================== 爆炸效果 ====================
function createExplosion(x, y, radius) {
    explosions.push({ x, y, radius, life: 15, maxLife: 15 });
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        particles.push({
            x, y,
            vx: Math.cos(angle) * 80, vy: Math.sin(angle) * 80,
            life: 20, color: '#ff6600', size: 4 + Math.random() * 4
        });
    }
}

function updateExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].life--;
        if (explosions[i].life <= 0) explosions.splice(i, 1);
    }
}

function drawExplosions() {
    for (const e of explosions) {
        const t = 1 - e.life / e.maxLife;
        const r = e.radius * t;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 100, 0, ${0.4 * (1 - t)})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 200, 0, ${0.6 * (1 - t)})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

// --- 玩家绘制 ---
function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    
    // 旋转护盾
    ctx.rotate(time * 0.05);
    ctx.beginPath();
    ctx.arc(0, 0, player.radius + 5, 0, Math.PI * 1.5);
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 4;
    ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.rotate(-time * 0.05);

    // 核心底座 - 鬼新娘风格
    let grad = ctx.createRadialGradient(0, -5, 5, 0, 0, player.radius);
    grad.addColorStop(0, 'rgba(255, 50, 50, 0.8)');
    grad.addColorStop(0.4, 'rgba(200, 0, 50, 0.6)');
    grad.addColorStop(1, 'rgba(100, 0, 0, 0.1)');
    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI*2);
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = '#ff4466'; ctx.lineWidth = 2; ctx.stroke();
    
    // 核心瞳孔
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0044'; ctx.fill();
    
    ctx.restore();
}

// --- Boss ---
class SnakeBoss {
    constructor() {
        this.segments = [];
        this.segmentCount = 120;
        this.hp = 5000 + (wave - 1) * 2000; 
        this.maxHp = this.hp;
        this.headX = W/2; this.headY = -100;
        this.speed = 1.5 + (wave - 1) * 0.3;
        this.radius = 25;
        this.amplitude = 180;
        this.frequency = 0.03;
        this.slowTimer = 0;
        
        for(let i=0; i<this.segmentCount; i++) {
            this.segments.push({ x: W/2, y: -100 - i * 10 });
        }
    }

    update() {
        let spd = this.speed;
        if (this.slowTimer > 0) {
            spd *= (1 - player.slowAmount);
            this.slowTimer -= 16;
        }
        
        this.headY += spd;
        this.headX = W/2 + Math.sin(this.headY * this.frequency + time * 0.02) * this.amplitude;
        
        if(this.headX < this.radius) this.headX = this.radius;
        if(this.headX > W - this.radius) this.headX = W - this.radius;

        let last = this.segments[0];
        let d = Math.hypot(this.headX - last.x, this.headY - last.y);
        if(d > 8) {
            this.segments.unshift({ x: this.headX, y: this.headY });
            if(this.segments.length > this.segmentCount) this.segments.pop();
        }
        
        // 碰撞
        if(this.headY > player.y - 50) {
             let dd = Math.hypot(this.headX - player.x, this.headY - player.y);
             if (dd < this.radius + player.radius) {
                 player.hp -= 100;
                 screenShake = 15;
                 showDamage(player.x, player.y, 100, true);
                 updateHpBar();
                 if (player.hp <= 0) gameOver();
             }
        }
    }

    draw() {
        // 龙身段 - 鬼新娘风格
        for(let i = this.segments.length - 1; i >= 0; i--) {
            let s = this.segments[i];
            let r = this.radius * (1 - (i / this.segmentCount) * 0.6); 
            if (r < 5) r = 5;
            
            let flicker = Math.sin(time * 0.2 + i * 0.1) * 0.1;
            let slowColor = this.slowTimer > 0 ? '100, 200, 255' : '100, 255, 100';
            ctx.beginPath();
            ctx.arc(s.x, s.y, r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(${slowColor}, ${0.6 + flicker})`;
            ctx.fill();
            ctx.strokeStyle = this.slowTimer > 0 ? '#88ccff' : '#00ff00'; ctx.lineWidth = 2; ctx.stroke();
        }

        // 头部
        ctx.save();
        ctx.translate(this.headX, this.headY);
        
        for(let t=0; t<6; t++) {
            let angle = (t / 6) * Math.PI * 2 + time * 0.1;
            let len = 40 + Math.sin(time*0.3 + t)*10;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(
                Math.cos(angle)*len*0.5 + Math.sin(time*0.5)*10, 
                Math.sin(angle)*len*0.5, 
                Math.cos(angle)*len, 
                Math.sin(angle)*len
            );
            ctx.strokeStyle = this.slowTimer > 0 ? '#88ccff' : '#00ff00'; ctx.lineWidth = 4; ctx.stroke();
        }

        ctx.beginPath(); ctx.arc(0, 0, this.radius * 1.5, 0, Math.PI*2);
        let headGrad = ctx.createRadialGradient(-5, -5, 5, 0, 0, this.radius * 1.5);
        headGrad.addColorStop(0, '#ffaaaa'); headGrad.addColorStop(0.5, '#ff4466'); headGrad.addColorStop(1, '#440022');
        ctx.fillStyle = headGrad; ctx.fill();
        
        ctx.fillStyle = 'red';
        ctx.beginPath(); ctx.arc(-10, -5, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(10, -5, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(-10, -5, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(10, -5, 2, 0, Math.PI*2); ctx.fill();
        
        ctx.restore();
    }

    takeDamage(dmg) {
        if (this.hp <= 0) return; // 已死亡不再受伤
        
        let isCrit = Math.random() < player.critRate;
        if (isCrit) dmg = Math.floor(dmg * player.critMult);
        
        this.hp -= dmg;
        showDamage(this.headX, this.headY - 30, dmg, isCrit);
        screenShake = Math.min(10, screenShake + 1);
        
        // 受伤也掉落经验球（2-3个）
        spawnXpOrbs(this.headX, this.headY, 2 + Math.floor(Math.random() * 2));
        
        // 吸血
        if (player.lifesteal > 0) {
            player.hp = Math.min(player.maxHp, player.hp + dmg * player.lifesteal);
            updateHpBar();
        }
        
        // 减速效果
        if (player.slowAmount > 0) {
            this.slowTimer = player.slowDuration;
        }
        
        // 爆炸效果（纯视觉，不额外扣血）
        if (player.explosive) {
            createExplosion(this.headX, this.headY, player.explosiveRadius);
        }
        
        for(let k=0; k<3; k++) {
            particles.push({
                x: this.headX, y: this.headY,
                vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 20, color: '#ff4466', size: 3 + Math.random()*5
            });
        }

        document.getElementById('boss-hp-fill').style.width = (Math.max(0, this.hp / this.maxHp) * 100) + '%';
        
        if (this.hp <= 0) {
            score += 1000 * wave;
            spawnXpOrbs(this.headX, this.headY, 8 + wave * 2);
            for(let k=0; k<100; k++) {
                particles.push({
                    x: this.headX, y: this.headY,
                    vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                    life: 60, color: Math.random()>0.5?'#ff4466':'#ffffff', size: 5+Math.random()*10
                });
            }
            wave++;
            document.getElementById('wave').textContent = wave;
            setTimeout(() => {
                boss = new SnakeBoss();
                document.getElementById('boss-hp-fill').style.width = '100%';
            }, 1000);
            this.segments = []; 
        }
    }
}

function showDamage(x, y, dmg, isCrit) {
    damageNums.push({ x: x+(Math.random()-0.5)*20, y: y, val: Math.floor(dmg), life: 40, color: isCrit?'#ffff00':'#ffffff', size: isCrit?24:16, vy: -2 });
}

function restartGame() {
    player.hp = 1000; player.maxHp = 1000; player.level = 1; player.xp = 0; player.xpToNext = 100;
    player.damage = 50; player.fireRate = 25; player.bulletCount = 1; player.pierce = 0;
    player.hasAngel = false; player.angelCount = 0;
    player.critRate = 0; player.critMult = 2.5;
    player.regenPerSec = 0; player.moveSpeed = 1;
    player.lifesteal = 0; player.explosive = false; player.explosiveRadius = 0;
    player.slowAmount = 0; player.slowDuration = 0;
    player.skills = {};
    player.fireTimer = 0;
    
    boss = new SnakeBoss();
    bullets = []; angels = []; particles = []; damageNums = []; xpOrbs = []; explosions = [];
    score = 0; time = 0; wave = 1; screenShake = 0;
    isPaused = false;
    
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('boss-hp-fill').style.width = '100%';
    document.getElementById('wave').textContent = '1';
    updateXpBar(); updateHpBar(); updateSkillsHud();
    gameState = 'playing';
}

function gameOver() {
    gameState = 'gameover';
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('final-score').innerText = score;
    document.getElementById('final-level').innerText = player.level;
    document.getElementById('final-wave').innerText = wave;
}

function update() {
    if (gameState !== 'playing') return;
    time++;
    
    // 玩家移动
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= 10 * player.moveSpeed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += 10 * player.moveSpeed;
    
    let distToInput = inputX - player.x;
    if (Math.abs(distToInput) > 2) {
        player.x += distToInput * 0.15 * player.moveSpeed;
    }
    
    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
    
    // 生命回复
    if (player.regenPerSec > 0) {
        regenTimer++;
        if (regenTimer >= 60) { // 每秒（60帧）
            player.hp = Math.min(player.maxHp, player.hp + player.regenPerSec);
            regenTimer = 0;
            updateHpBar();
        }
    }
    
    let secs = Math.floor(time/60);
    document.getElementById('time').innerText = `${Math.floor(secs/60)}:${(secs%60).toString().padStart(2,'0')}`;
    document.getElementById('score').innerText = score;

    if(!boss) boss = new SnakeBoss();
    boss.update();

    // 射击
    if (player.fireTimer > 0) player.fireTimer--;
    else {
        player.fireTimer = player.fireRate;
        let targetX = boss.headX, targetY = boss.headY;
        let angle = Math.atan2(targetY - player.y, targetX - player.x);
        let spread = player.bulletCount > 1 ? 0.25 : 0;
        
        for(let i=0; i<player.bulletCount; i++) {
            let a = angle + (i - (player.bulletCount-1)/2) * spread;
            let dmg = player.damage;
            bullets.push({
                x: player.x, y: player.y,
                vx: Math.cos(a) * 14, vy: Math.sin(a) * 14,
                dmg: dmg, color: player.explosive ? '#ff6600' : '#ff4466',
                pierce: player.pierce, life: 10
            });
        }
    }

    // 天使
    if (player.hasAngel && angels.length < player.angelCount) {
        angels.push({ x: W/2, y: H/2, timer: 0 });
    }
    angels.forEach(a => {
        a.timer++;
        a.x = W/2 + Math.sin(a.timer * 0.03) * 150;
        a.y = H/3 + Math.cos(a.timer * 0.04) * 100;
        if (a.timer % 20 === 0) {
             bullets.push({
                x: a.x, y: a.y, vx: (boss.headX - a.x) * 0.06, vy: (boss.headY - a.y) * 0.06,
                dmg: Math.floor(player.damage * 0.3), color: '#ffff00', pierce: 0, life: 10
            });
        }
    });

    // 子弹
    for(let i=bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        
        particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 5, color: b.color, size: 2 });

        if(b.x < 0 || b.x > W || b.y < 0 || b.y > H) { bullets.splice(i, 1); continue; }

        if(boss) {
            let d = Math.hypot(b.x - boss.headX, b.y - boss.headY);
            if(d < boss.radius * 2) {
                boss.takeDamage(b.dmg);
                b.pierce--;
                if(b.pierce < 0) { bullets.splice(i, 1); continue; }
            }
        }
    }

    // 粒子
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if(p.life <= 0) particles.splice(i, 1);
    }

    // 数字
    for(let i=damageNums.length-1; i>=0; i--) {
        let d = damageNums[i];
        d.y += d.vy; d.life--;
        if(d.life <= 0) damageNums.splice(i, 1);
    }
    
    // 经验球
    updateXpOrbs();
    
    // 爆炸
    updateExplosions();
    
    if(screenShake > 0) screenShake *= 0.9;
    if(screenShake < 0.5) screenShake = 0;
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    ctx.save();
    if(screenShake > 0) {
        ctx.translate((Math.random()-0.5)*screenShake*5, (Math.random()-0.5)*screenShake*5);
    }

    // 背景
    ctx.strokeStyle = 'rgba(255, 0, 50, 0.05)'; ctx.lineWidth = 2;
    for(let i=0; i<W; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
    
    if(boss) boss.draw();
    
    angels.forEach(a => {
        ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('👼', a.x, a.y);
        ctx.beginPath(); ctx.arc(a.x, a.y, 30, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
    });

    drawPlayer();
    
    drawExplosions();
    
    bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
        ctx.fillStyle = b.color; ctx.shadowBlur = 10; ctx.shadowColor = b.color; ctx.fill(); ctx.shadowBlur = 0;
    });
    
    damageNums.forEach(d => {
        ctx.fillStyle = d.color; ctx.font = `bold ${d.size}px Arial`; ctx.fillText(d.val, d.x, d.y);
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life / 20;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fillStyle = p.color; ctx.fill();
        ctx.globalAlpha = 1;
    });

    drawXpOrbs();
    
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
