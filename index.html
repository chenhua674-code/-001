<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>社牛病毒 - 第1关</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: Arial, sans-serif; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; }
canvas { display: block; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#hud { position: absolute; top: 6px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 14px; font-weight: bold; text-shadow: 0 1px 3px #000; }
#progress-bar { position: absolute; top: 32px; left: 8%; width: 84%; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; }
#progress-fill { height: 100%; background: linear-gradient(90deg, #44ff88, #88ffcc); width: 0%; transition: width 0.3s; }
#progress-text { position: absolute; top: 32px; width: 100%; text-align: center; color: #fff; font-size: 10px; text-shadow: 0 1px 2px #000; }

#skill-menu { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.82); pointer-events: auto; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
#skill-menu.show { display: flex; }
#skill-menu h2 { color: #ffd700; font-size: 18px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
.color-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.color-tab { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); cursor: pointer; }
.color-tab.active { border-color: #fff; transform: scale(1.15); }
.color-tab.red { background: linear-gradient(135deg, #ff4444, #cc2222); }
.color-tab.yellow { background: linear-gradient(135deg, #ffcc00, #cc9900); }
.color-tab.purple { background: linear-gradient(135deg, #aa44ff, #7722cc); }
.color-tab.blue { background: linear-gradient(135deg, #4488ff, #2266cc); }
.color-tab.green { background: linear-gradient(135deg, #44ff44, #22cc22); }
.skill-cards { display: flex; flex-direction: column; gap: 6px; width: 88%; max-width: 340px; }
.skill-card { background: linear-gradient(135deg, #2a2a3a, #1a1a28); border: 2px solid #444; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; cursor: pointer; pointer-events: auto; }
.skill-card:active { transform: scale(0.97); }
.skill-card .icon { font-size: 24px; margin-right: 10px; }
.skill-card .name { color: #fff; font-size: 14px; font-weight: bold; }
.skill-card .desc { color: #999; font-size: 11px; margin-top: 2px; }
.skill-btns { margin-top: 12px; display: flex; gap: 10px; }
.sbtn { padding: 8px 16px; border-radius: 16px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; color: #fff; }
.sbtn-refresh { background: linear-gradient(180deg, #4488ff, #2266cc); }
.sbtn-all { background: linear-gradient(180deg, #ffaa00, #cc8800); }

#game-over { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); pointer-events: auto; flex-direction: column; justify-content: center; align-items: center; }
#game-over.show { display: flex; }
#game-over h1 { color: #ff3333; font-size: 28px; margin-bottom: 8px; }
#game-over p { color: #ccc; font-size: 14px; margin-bottom: 15px; }
#game-over button { padding: 10px 30px; background: #ff3333; border: none; color: #fff; font-size: 16px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <span>❤️ <span id="hp">100</span></span>
    <span>第1关：社牛病毒</span>
    <span>⏱️ <span id="tm">00:00</span></span>
  </div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="progress-text">进度: <span id="pv">0</span>%</div>
  <div id="skill-menu">
    <h2>✨ 强化属性 ✨</h2>
    <div class="color-tabs">
      <div class="color-tab red"></div>
      <div class="color-tab yellow"></div>
      <div class="color-tab purple"></div>
      <div class="color-tab blue active"></div>
      <div class="color-tab green"></div>
    </div>
    <div class="skill-cards" id="sc"></div>
    <div class="skill-btns">
      <button class="sbtn sbtn-refresh" onclick="refresh()">免费刷新 (<span id="rc">1</span>)</button>
      <button class="sbtn sbtn-all" onclick="getAll()">获得全部 (<span id="ac">2</span>)</button>
    </div>
  </div>
  <div id="game-over">
    <h1>💀 阵亡</h1>
    <p>进度: <span id="fp">0</span>%</p>
    <button onclick="restart()">继续挑战</button>
  </div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function resize(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

// 游戏状态
let state='play',time=0,progress=0,refreshC=1,allC=2,skills=[],skillOpts=[];
const P={x:0,y:0,r:18,hp:100,mhp:100,dmg:25,rate:0.7,timer:0,lv:1,exp:0,expN:40,
  count:1,pierce:0,skills:{spin:false,bubble:false,trail:false,pierce:false}};
let bullets=[],segs=[],orbs=[],nums=[],parts=[];
let spawnT=0,wave=1;

// 技能定义
const SKILLS=[
  {id:'pill',name:'药丸数量',icon:'💊',desc:'同时发射的药丸 +2',color:'#ffcc00',fx:()=>{P.count+=2}},
  {id:'rate',name:'连续射击',icon:'⚡',desc:'发射速度 +25%',color:'#4488ff',fx:()=>{P.rate*=0.75}},
  {id:'dmg',name:'伤害提升',icon:'💥',desc:'伤害 +30%',color:'#ff4444',fx:()=>{P.dmg=Math.floor(P.dmg*1.3)}},
  {id:'hp',name:'生命强化',icon:'❤️',desc:'最大生命 +40',color:'#ff6666',fx:()=>{P.mhp+=40;P.hp+=40}},
  {id:'heal',name:'紧急治疗',icon:'💚',desc:'恢复 40% 生命',color:'#44ff44',fx:()=>{P.hp=Math.min(P.hp+P.mhp*0.4,P.mhp)}},
  {id:'pierce',name:'针灸',icon:'💉',desc:'子弹穿透 +1',color:'#ff44aa',fx:()=>{P.pierce++;P.skills.pierce=true}},
  {id:'spin',name:'按摩棒',icon:'🌀',desc:'发射旋转弹丸',color:'#ff88cc',fx:()=>{P.skills.spin=true}},
  {id:'bubble',name:'排毒泡泡',icon:'🫧',desc:'发射追踪泡泡',color:'#aa44ff',fx:()=>{P.skills.bubble=true}},
  {id:'trail',name:'鼻涕龙之力',icon:'🐉',desc:'子弹带拖尾伤害',color:'#44ffaa',fx:()=>{P.skills.trail=true}}
];

function genSkills(){
  skillOpts=[...SKILLS].sort(()=>Math.random()-0.5).slice(0,3);
  renderSkills();
}
function renderSkills(){
  const el=document.getElementById('sc');el.innerHTML='';
  skillOpts.forEach((s,i)=>{
    const d=document.createElement('div');d.className='skill-card';
    d.style.borderColor=s.color;
    d.innerHTML=`<div class="icon">${s.icon}</div><div><div class="name">${s.name}</div><div class="desc">${s.desc}</div></div>`;
    d.onclick=()=>{applySkill(s);closeMenu()};el.appendChild(d);
  });
  document.getElementById('rc').textContent=refreshC;
  document.getElementById('ac').textContent=allC;
}
function applySkill(s){s.fx()}
function closeMenu(){state='play';document.getElementById('skill-menu').classList.remove('show')}
function showMenu(){state='menu';genSkills();document.getElementById('skill-menu').classList.add('show')}
function refresh(){if(refreshC>0){refreshC--;genSkills()}}
function getAll(){if(allC>0){allC--;skillOpts.forEach(s=>applySkill(s));closeMenu()}}

// 玩家位置
P.x=W/2;P.y=H-80;

// 输入
let touchX=null,touchY=null,touching=false;
C.addEventListener('touchstart',e=>{e.preventDefault();touching=true;const t=e.touches[0];touchX=t.clientX;touchY=t.clientY},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];touchX=t.clientX;touchY=t.clientY},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();touching=false},{passive:false});
C.addEventListener('mousemove',e=>{if(e.buttons===1){touchX=e.clientX;touchY=e.clientY;touching=true}});
C.addEventListener('mousedown',e=>{touchX=e.clientX;touchY=e.clientY;touching=true});
C.addEventListener('mouseup',()=>{touching=false});

// Boss 蛇身段
function initBoss(){
  segs=[];
  const n=30+wave*5;
  const headHP=300+wave*150;
  for(let i=0;i<n;i++){
    const hp=i===0?headHP:80+wave*20;
    segs.push({x:W/2,y:-30-i*12,hp,mhp:hp,r:i===0?28:14-i*0.15,head:i===0,wobble:Math.random()*6.28,hit:0});
  }
}

function restart(){
  P.x=W/2;P.y=H-80;P.hp=100;P.mhp=100;P.dmg=25;P.rate=0.7;P.timer=0;
  P.lv=1;P.exp=0;P.expN=40;P.count=1;P.pierce=0;
  P.skills={spin:false,bubble:false,trail:false,pierce:false};
  bullets=[];segs=[];orbs=[];nums=[];parts=[];
  time=0;progress=0;wave=1;spawnT=0;refreshC=1;allC=2;
  state='play';
  document.getElementById('skill-menu').classList.remove('show');
  document.getElementById('game-over').classList.remove('show');
  initBoss();
}

// 射击
function shoot(){
  const target=segs.find(s=>s.hp>0);
  if(!target)return;
  const ang=Math.atan2(target.y-P.y,target.x-P.x);
  const spread=P.count>1?0.15:0;
  let type='arrow';
  if(P.skills.spin)type='spin';
  else if(P.skills.bubble)type='bubble';
  else if(P.skills.trail)type='trail';
  else if(P.skills.pierce)type='pierce';
  for(let i=0;i<P.count;i++){
    const a=ang+(i-(P.count-1)/2)*spread;
    const spd=380;
    bullets.push({x:P.x,y:P.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg:P.dmg,pierce:P.pierce,type,life:3,r:type==='spin'?7:type==='bubble'?6:4,rot:0,trail:[]});
  }
}

function showNum(x,y,v,c='#fff'){nums.push({x:x+(Math.random()-0.5)*8,y:y-5,v:Math.floor(v),c,life:25,vy:-2.5})}
function spawnOrb(x,y,a){orbs.push({x:x+(Math.random()-0.5)*12,y:y+(Math.random()-0.5)*12,a,life:8,att:false})}
function spawnParts(x,y,c,n=5){for(let i=0;i<n;i++){const a=Math.PI*2/n*i;parts.push({x,y,vx:Math.cos(a)*(40+Math.random()*40),vy:Math.sin(a)*(40+Math.random()*40),life:15+Math.random()*10,c,s:2+Math.random()*3})}}

// 更新
function update(){
  if(state!=='play')return;
  time++;
  progress=Math.min(100,Math.floor(time/36));
  document.getElementById('progress-fill').style.width=progress+'%';
  document.getElementById('pv').textContent=progress;
  const s=Math.floor(time/60);
  document.getElementById('tm').textContent=`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  document.getElementById('hp').textContent=Math.ceil(P.hp);

  if(P.exp>=P.expN){P.exp-=P.expN;P.lv++;P.expN=Math.floor(P.expN*1.4);showMenu();return}

  // 玩家移动
  if(touching&&touchX!==null){
    const dx=touchX-P.x,dy=touchY-P.y;
    const d=Math.hypot(dx,dy);
    if(d>3){P.x+=dx/d*3;P.y+=dy/d*3}
  }
  P.x=Math.max(P.r,Math.min(W-P.r,P.x));
  P.y=Math.max(50,Math.min(H-P.r,P.y));

  // 射击
  P.timer++;
  if(P.timer>=P.rate*60){P.timer=0;shoot()}

  // 更新蛇身
  if(segs.length===0)initBoss();
  const head=segs[0];
  if(head){
    head.y+=0.4;
    head.x=W/2+Math.sin(time*0.015)*120;
    head.x=Math.max(head.r,Math.min(W-head.r,head.x));
    head.y=Math.min(head.y,60);
    for(let i=1;i<segs.length;i++){
      const prev=segs[i-1];
      const dx=prev.x-segs[i].x,dy=prev.y-segs[i].y;
      const d=Math.hypot(dx,dy);
      if(d>10){segs[i].x+=dx/d*1.5;segs[i].y+=dy/d*1.5}
    }
  }

  // 子弹
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx/60;b.y+=b.vy/60;b.life-=1/60;
    if(b.type==='spin')b.rot+=0.2;
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>5)b.trail.shift();
    if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){bullets.splice(i,1);continue}
    for(let j=0;j<segs.length;j++){
      const s=segs[j];if(s.hp<=0)continue;
      if(Math.hypot(b.x-s.x,b.y-s.y)<b.r+s.r){
        s.hp-=b.dmg;s.hit=5;
        showNum(s.x,s.y,b.dmg,b.type==='pierce'?'#ff88ff':'#fff');
        spawnParts(s.x,s.y,b.type==='trail'?'#44ffaa':'#ffaa44',3);
        if(b.pierce>0)b.pierce--;else{bullets.splice(i,1);break}
        if(s.hp<=0){
          spawnOrb(s.x,s.y,s.mhp/5);spawnParts(s.x,s.y,s.head?'#ff4444':'#cc8866',8);
          if(s.head&&segs.length>1){
            // 头部死亡，整条蛇重置
            setTimeout(()=>initBoss(),1500);
          }
        }
      }
    }
  }

  // 蛇头碰撞玩家
  if(head&&head.hp>0){
    if(Math.hypot(head.x-P.x,head.y-P.y)<head.r+P.r){
      P.hp-=5;showNum(P.x,P.y,5,'#ff4444');spawnParts(P.x,P.y,'#ff4444',4);
      if(P.hp<=0){P.hp=0;state='dead';document.getElementById('fp').textContent=progress;document.getElementById('game-over').classList.add('show')}
    }
  }
  // 更新血量数字
  for(let i=segs.length-1;i>=0;i--){
    segs[i].hit=Math.max(0,segs[i].hit-1);
    segs[i].wobble+=0.05;
  }

  // 经验球
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];o.life-=1/60;
    const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy);
    if(d<60){o.att=true;o.x+=dx/d*3;o.y+=dy/d*3}
    if(d<P.r+5){P.exp+=o.a;showNum(P.x,P.y-15,'+'+Math.floor(o.a),'#44ff88');orbs.splice(i,1);continue}
    if(o.life<=0)orbs.splice(i,1);
  }

  // 粒子
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx/60;p.y+=p.vy/60;p.life--;if(p.life<=0)parts.splice(i,1)}
  // 数字
  for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.y+=n.vy;n.life--;if(n.life<=0)nums.splice(i,1)}
}

// 绘制
// roundRect polyfill for older browsers
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
    this.moveTo(x+r.tl,y);this.lineTo(x+w-r.tr,y);this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br);this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl);this.quadraticCurveTo(x,y,x+r.tl,y);this.closePath();return this;
  };
}
function drawBG(){
  const g=X.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  g.addColorStop(0,'#1a2a3a');g.addColorStop(1,'#050a10');
  X.fillStyle=g;X.fillRect(0,0,W,H);
  // 地面装饰
  X.fillStyle='rgba(40,60,40,0.5)';
  for(let i=0;i<8;i++){
    X.beginPath();X.arc(W*0.1+Math.random()*W*0.8,H*0.7+Math.random()*H*0.25,15+Math.random()*20,0,Math.PI*2);X.fill();
  }
}

function drawPlayer(){
  const px=P.x,py=P.y,r=P.r;
  // 光环
  X.strokeStyle=`rgba(68,136,255,${0.3+Math.sin(time*0.05)*0.1})`;X.lineWidth=2;
  X.beginPath();X.arc(px,py,r+8,0,Math.PI*2);X.stroke();
  // 等级
  X.fillStyle='#4488ff';X.font='bold 11px Arial';X.textAlign='center';
  X.fillText(P.lv,px,py-r-10);
  // 阴影
  X.fillStyle='rgba(0,0,0,0.3)';X.beginPath();X.ellipse(px,py+r+3,r*0.6,r*0.12,0,0,Math.PI*2);X.fill();
  // 身体绿色Q版
  X.fillStyle='#44cc44';X.beginPath();X.ellipse(px,py+2,r*0.55,r*0.6,0,0,Math.PI*2);X.fill();
  // 头
  X.fillStyle='#88ee88';X.beginPath();X.arc(px,py-r*0.25,r*0.45,0,Math.PI*2);X.fill();
  // 王冠
  X.fillStyle='#ffcc00';X.beginPath();
  X.moveTo(px-6,py-r*0.6);X.lineTo(px-8,py-r*0.85);X.lineTo(px-3,py-r*0.7);
  X.lineTo(px,py-r*0.9);X.lineTo(px+3,py-r*0.7);X.lineTo(px+8,py-r*0.85);X.lineTo(px+6,py-r*0.6);
  X.fill();
  // 眼睛
  X.fillStyle='#333';X.beginPath();X.arc(px-3,py-r*0.2,1.5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(px+3,py-r*0.2,1.5,0,Math.PI*2);X.fill();
  // 血条
  const bw=28,bh=3,ratio=P.hp/P.mhp;
  X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(px-bw/2,py+r+5,bw,bh);
  X.fillStyle=ratio>0.5?'#44ff44':ratio>0.25?'#ffaa00':'#ff4444';
  X.fillRect(px-bw/2,py+r+5,bw*ratio,bh);
}

function drawSeg(s){
  if(s.hp<=0)return;
  const r=s.r,w=Math.sin(s.wobble)*1.5;
  const c=s.hit>0?'#fff':s.head?'#884422':'#cc8866';
  const dc=s.hit>0?'#ccc':s.head?'#663311':'#995533';
  // 阴影
  X.fillStyle='rgba(0,0,0,0.2)';X.beginPath();X.ellipse(s.x,s.y+r+2,r*0.6,r*0.1,0,0,Math.PI*2);X.fill();
  // 身体
  X.fillStyle=c;X.beginPath();X.ellipse(s.x+w,s.y,r,r*0.8,0,0,Math.PI*2);X.fill();
  X.fillStyle=dc;X.beginPath();X.ellipse(s.x+w,s.y+1,r*0.7,r*0.4,0,0,Math.PI*2);X.fill();
  if(s.head){
    // Boss头 - 角
    X.strokeStyle='#ddd';X.lineWidth=3;
    X.beginPath();X.moveTo(s.x-r*0.3,s.y-r*0.4);X.quadraticCurveTo(s.x-r*0.6,s.y-r*1,s.x-r*0.1,s.y-r*0.7);X.stroke();
    X.beginPath();X.moveTo(s.x+r*0.3,s.y-r*0.4);X.quadraticCurveTo(s.x+r*0.6,s.y-r*1,s.x+r*0.1,s.y-r*0.7);X.stroke();
    // 红色眼睛
    X.fillStyle='#ff2222';X.shadowColor='#ff0000';X.shadowBlur=5;
    X.beginPath();X.arc(s.x-6,s.y-2,3,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(s.x+6,s.y-2,3,0,Math.PI*2);X.fill();
    X.shadowBlur=0;
    // 鼻子
    X.fillStyle='#44cccc';X.beginPath();X.arc(s.x,s.y+3,4,0,Math.PI*2);X.fill();
    // 獠牙
    X.fillStyle='#eee';X.beginPath();X.moveTo(s.x-5,s.y+5);X.lineTo(s.x-7,s.y+9);X.lineTo(s.x-3,s.y+6);X.fill();
    X.beginPath();X.moveTo(s.x+5,s.y+5);X.lineTo(s.x+7,s.y+9);X.lineTo(s.x+3,s.y+6);X.fill();
    // BOSS标签
    X.fillStyle='#ff4444';X.font='bold 9px Arial';X.textAlign='center';X.fillText('BOSS',s.x,s.y-r-12);
  }else{
    // 小段眼睛
    X.fillStyle='#ffcc00';X.beginPath();X.arc(s.x-3+w,s.y-2,2,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(s.x+3+w,s.y-2,2,0,Math.PI*2);X.fill();
  }
  // 血条
  const bw=r*2,bh=2,ratio=Math.max(0,s.hp/s.mhp);
  X.fillStyle='rgba(0,0,0,0.5)';X.fillRect(s.x-bw/2,s.y-r-8,bw,bh);
  X.fillStyle='#ff4444';X.fillRect(s.x-bw/2,s.y-r-8,bw*ratio,bh);
  // 血量数字
  X.fillStyle='#ff4444';X.font=`bold ${s.head?9:7}px Arial`;X.textAlign='center';
  X.fillText(Math.ceil(s.hp),s.x,s.y-r-12);
}

function drawBullet(b){
  X.save();X.translate(b.x,b.y);
  if(b.type==='spin'){
    X.rotate(b.rot);X.fillStyle='#fff';X.fillRect(-1.5,-6,3,12);
    X.fillStyle='#ff88cc';X.beginPath();X.arc(0,-6,3,0,Math.PI*2);X.fill();
  }else if(b.type==='bubble'){
    X.fillStyle='rgba(170,68,255,0.4)';X.beginPath();X.arc(0,0,5,0,Math.PI*2);X.fill();
    X.fillStyle='#aa44ff';X.beginPath();X.arc(0,0,3,0,Math.PI*2);X.fill();
  }else if(b.type==='trail'){
    X.fillStyle='#44ffaa';X.shadowColor='#44ffaa';X.shadowBlur=4;
    X.beginPath();X.arc(0,0,4,0,Math.PI*2);X.fill();X.shadowBlur=0;
  }else if(b.type==='pierce'){
    const a=Math.atan2(b.vy,b.vx);X.rotate(a);X.fillStyle='#ff4444';X.shadowColor='#ff4444';X.shadowBlur=3;
    X.fillRect(-1,-8,2,16);X.shadowBlur=0;
  }else{
    const a=Math.atan2(b.vy,b.vx);X.rotate(a);X.fillStyle='#4488ff';X.shadowColor='#4488ff';X.shadowBlur=5;
    X.beginPath();X.moveTo(5,0);X.lineTo(-2,-3);X.lineTo(0,0);X.lineTo(-2,3);X.closePath();X.fill();X.shadowBlur=0;
  }
  // 拖尾
  if(b.trail.length>1){
    X.strokeStyle='rgba(68,136,255,0.25)';X.lineWidth=2;X.beginPath();X.moveTo(0,0);
    for(let i=b.trail.length-1;i>=0;i--)X.lineTo(b.trail[i].x-b.x,b.trail[i].y-b.y);
    X.stroke();
  }
  X.restore();
}

function drawOrb(o){
  const a=Math.min(1,o.life*2);
  X.fillStyle=`rgba(68,255,136,${a*0.3})`;X.beginPath();X.arc(o.x,o.y,7,0,Math.PI*2);X.fill();
  X.fillStyle=`rgba(68,255,136,${a})`;X.beginPath();X.arc(o.x,o.y,3,0,Math.PI*2);X.fill();
}

function drawHUD(){
  const ew=Math.min(160,W*0.3),eh=4,ex=(W-ew)/2,ey=44,er=P.exp/P.expN;
  X.fillStyle='rgba(0,0,0,0.5)';X.beginPath();X.roundRect(ex,ey,ew,eh,2);X.fill();
  const eg=X.createLinearGradient(ex,0,ex+ew,0);eg.addColorStop(0,'#2266cc');eg.addColorStop(1,'#44aaff');
  X.fillStyle=eg;X.beginPath();X.roundRect(ex,ey,ew*er,eh,2);X.fill();
  X.fillStyle='#fff';X.font='8px Arial';X.textAlign='center';X.fillText('Lv.'+P.lv,W/2,ey+11);
  // 技能图标
  let sx=6;X.font='12px Arial';X.textAlign='left';
  if(P.skills.pierce){X.fillText('💉',sx,58);sx+=16}
  if(P.skills.spin){X.fillText('🌀',sx,58);sx+=16}
  if(P.skills.bubble){X.fillText('🫧',sx,58);sx+=16}
  if(P.skills.trail){X.fillText('🐉',sx,58);sx+=16}
}

function draw(){
  X.clearRect(0,0,W,H);drawBG();
  for(const o of orbs)drawOrb(o);
  for(const s of segs)drawSeg(s);
  drawPlayer();
  for(const b of bullets)drawBullet(b);
  for(const p of parts){X.globalAlpha=Math.min(1,p.life/15);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s,0,Math.PI*2);X.fill()}
  X.globalAlpha=1;
  for(const n of nums){X.globalAlpha=Math.min(1,n.life/15);X.fillStyle=n.c;X.font='bold 10px Arial';X.textAlign='center';X.fillText(n.v,n.x,n.y)}
  X.globalAlpha=1;
  drawHUD();
}

function loop(){update();draw();requestAnimationFrame(loop)}
restart();loop();
</script>
</body>
</html>
