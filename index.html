<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>鬼新娘 - 弹射打龙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'PingFang SC','Microsoft YaHei',sans-serif;touch-action:none}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hud{display:flex;justify-content:space-between;padding:8px 12px;color:#fff;font-size:14px;text-shadow:0 2px 4px #000}
#boss-area{position:absolute;top:30px;left:0;width:100%;text-align:center;pointer-events:none}
#boss-name{color:#ff5555;font-size:14px;font-weight:bold;text-shadow:0 0 5px red}
#boss-hp-bg{width:80%;height:10px;background:#333;border:1px solid #555;border-radius:5px;margin:2px auto;overflow:hidden}
#boss-hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#f00,#f80);transition:width .1s}
#player-hp-area{position:absolute;bottom:10px;left:10%;width:80%;height:12px;background:#222;border:1px solid #444;border-radius:6px;overflow:hidden}
#player-hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#0f8,#0a5);transition:width .1s}
#player-hp-text{position:absolute;top:0;width:100%;text-align:center;color:#fff;font-size:10px;line-height:12px}
#xp-area{position:absolute;bottom:26px;left:10%;width:80%;height:6px;background:#222;border-radius:3px;overflow:hidden}
#xp-fill{height:100%;width:0%;background:#0ff;transition:width .1s}
#buff-bar{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.buff-item{width:22px;height:22px;background:rgba(0,0,0,.7);border:1px solid #666;border-radius:3px;text-align:center;line-height:22px;font-size:11px}
#skill-menu{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);pointer-events:auto;backdrop-filter:blur(5px)}
#skill-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:400px;text-align:center}
#skill-content h2{color:#0f8;text-shadow:0 0 10px #0f8;margin-bottom:15px}
.skill-card{background:linear-gradient(135deg,#222,#111);border:2px solid #444;color:#fff;padding:12px;margin:8px 0;border-radius:10px;display:flex;align-items:center;cursor:pointer;text-align:left}
.skill-card:active{transform:scale(.98)}
.s-icon{font-size:28px;margin-right:12px;flex-shrink:0}
.s-name{color:#0ff;font-weight:bold;font-size:16px}
.s-desc{color:#aaa;font-size:12px;margin-top:2px}
#game-over{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#000;pointer-events:auto;flex-direction:column;justify-content:center;align-items:center;color:#fff}
#game-over h1{color:#f33;font-size:36px;margin-bottom:10px}
#restart-btn{padding:12px 30px;background:#f33;border:none;color:#fff;font-size:18px;border-radius:6px;cursor:pointer}
#wave-msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;font-weight:bold;text-shadow:0 0 10px #0ff;opacity:0;pointer-events:none;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud">
    <span>💎 <span id="score">0</span></span>
    <span>⏱️ <span id="time">00:00</span></span>
  </div>
  <div id="boss-area">
    <div id="boss-name">👰 鬼新娘长龙</div>
    <div id="boss-hp-bg"><div id="boss-hp-fill"></div></div>
  </div>
  <div id="xp-area"><div id="xp-fill"></div></div>
  <div id="player-hp-area"><div id="player-hp-fill"></div><div id="player-hp-text">1000/1000</div></div>
  <div id="buff-bar"></div>
  <div id="wave-msg"></div>
</div>

<div id="skill-menu">
  <div id="skill-content">
    <h2>⬆️ 升级! 选择强化</h2>
    <div id="skills"></div>
  </div>
</div>

<div id="game-over">
  <h1>💀 阵亡</h1>
  <p>分数: <span id="final-score">0</span></p>
  <p id="restart-btn">再来一把</p>
</div>

<script>
'use strict';
const C = document.getElementById('c');
const X = C.getContext('2d');
let W, H;

function resize() {
    W = C.width = window.innerWidth;
    H = C.height = window.innerHeight;
    try { if (G.p) G.p.y = H - 80; } catch(e) {}
}
window.addEventListener('resize', resize);
resize();

// 游戏状态
let G = {
    state: 'play', // play, skill, dead
    time: 0, frame: 0, score: 0,
    shake: 0, wave: 0,
    bullets: [], particles: [], nums: [],
    dragon: null, p: null
};

// 输入
let MX = W / 2;
C.addEventListener('mousemove', e => MX = e.clientX);
C.addEventListener('touchmove', e => { if(e.touches[0]) MX = e.touches[0].clientX; }, {passive:true});

// 玩家类
class Player {
    constructor() {
        this.x = W / 2; this.y = H - 80;
        this.r = 20;
        this.hp = 1000; this.maxHp = 1000;
        this.dmg = 10;
        this.rate = 30; this.timer = 0;
        this.xp = 0; this.xpNext = 200; this.lv = 1;
        this.pierce = 0; this.bounce = 1; this.count = 1; this.speed = 1;
        this.crit = 0.05; this.critDmg = 1.5;
        this.buffs = {slow:false, burn:false, poison:false};
    }
    update() {
        // 移动跟随
        let dx = MX - this.x;
        this.x += dx * 0.03;
        this.x = Math.max(this.r, Math.min(W - this.r, this.x));
        
        // 射击
        if (this.timer-- <= 0) {
            this.timer = this.rate;
            this.fire();
        }
    }
    fire() {
        let angle = -90;
        let spread = this.count > 1 ? 0.2 : 0;
        for (let i = 0; i < this.count; i++) {
            let a = angle + (i - (this.count - 1) / 2) * spread;
            let rad = a * Math.PI / 180;
            G.bullets.push(new Bullet(
                this.x, this.y - 20,
                Math.cos(rad) * 10 * this.speed,
                Math.sin(rad) * 10 * this.speed,
                this.dmg, this.pierce, this.bounce, {...this.buffs}
            ));
        }
    }
    draw() {
        X.save();
        X.translate(this.x, this.y);
        // 核心光效 - 鬼新娘风格
        X.shadowBlur = 15; X.shadowColor = '#ff4466';
        X.beginPath(); X.arc(0, 0, this.r, 0, Math.PI * 2);
        let grad = X.createRadialGradient(0, -5, 5, 0, 0, this.r);
        grad.addColorStop(0, 'rgba(255,100,100,0.8)');
        grad.addColorStop(0.4, 'rgba(200,0,50,0.6)');
        grad.addColorStop(1, 'rgba(100,0,0,0.1)');
        X.fillStyle = grad; X.fill();
        X.strokeStyle = '#ff4466'; X.lineWidth = 2; X.stroke();
        // 旋转护盾
        X.rotate(G.time * 0.05);
        X.beginPath(); X.arc(0, 0, this.r + 8, 0, Math.PI * 1.5);
        X.strokeStyle = '#fff'; X.lineWidth = 3; X.stroke();
        X.restore();
    }
}

// 子弹类
class Bullet {
    constructor(x, y, vx, vy, dmg, pierce, bounce, buffs) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.dmg = dmg; this.pierce = pierce;
        this.bounce = bounce; this.maxBounce = bounce;
        this.buffs = buffs || {};
        this.r = 4; this.life = 300;
        this.color = '#ff0'; this.trail = [];
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        
        // 拖尾
        this.trail.push({x:this.x, y:this.y, life:8});

        // 墙壁反弹 (原版核心物理)
        let hit = false;
        if (this.x < 0) { this.x = 0; this.vx *= -1; hit = true; }
        if (this.x > W) { this.x = W; this.vx *= -1; hit = true; }
        if (this.y < 0) { this.y = 0; this.vy *= -1; hit = true; }
        if (this.y > H) { this.y = H; this.vy *= -1; hit = true; }

        if (hit) {
            this.bounce--;
            G.addParticles(this.x, this.y, '#0ff', 3);
        }

        // 判定碰撞蛇身
        if (G.dragon && G.dragon.alive) {
            for (let i = 0; i < G.dragon.segs.length; i++) {
                let s = G.dragon.segs[i];
                if (s.hp <= 0) continue;
                let dx = this.x - s.x, dy = this.y - s.y;
                if (Math.sqrt(dx*dx + dy*dy) < s.r + this.r) {
                    // 伤害计算
                    let isCrit = Math.random() < G.p.crit;
                    let d = this.dmg * (isCrit ? G.p.critDmg : 1);
                    s.hp -= d;
                    G.dragon.hp -= d;
                    s.hit = 5;
                    G.addNum(s.x, s.y, Math.floor(d), isCrit, isCrit ? '#ff0' : '#fff');
                    G.addParticles(s.x, s.y, '#f00', 4);

                    // Buff 效果
                    if (this.buffs && this.buffs.slow) G.dragon.spd *= 0.95;
                    if (this.buffs && this.buffs.burn) s.dot = 20;

                    this.pierce--;
                    if (this.pierce < 0 || this.bounce < 0) { this.life = 0; }
                    
                    if (G.dragon.hp <= 0) G.dragonDie();
                    updateUI();
                    break;
                }
            }
        }

        if (this.life <= 0 || this.bounce < 0) return false;
        return true;
    }
    draw() {
        // 画拖尾
        for (let t of this.trail) {
            t.life--;
            if(t.life > 0) {
                X.globalAlpha = t.life/8 * 0.5;
                X.fillStyle = this.color;
                X.beginPath(); X.arc(t.x, t.y, 2, 0, Math.PI*2); X.fill();
            }
        }
        X.globalAlpha = 1;
        X.fillStyle = this.color;
        X.beginPath(); X.arc(this.x, this.y, this.r, 0, Math.PI*2); X.fill();
    }
}

// 蛇 BOSS 类
class Dragon {
    constructor(wave) {
        this.wave = wave;
        this.segs = [];
        this.count = 100;
        this.r = 25;
        this.spd = 0.35 + wave * 0.03;
        this.headX = W/2; this.headY = -120; this.baseY = -120;
        this.angle = 0;
        this.alive = true;
        
        // 创建蛇身 - 链式物理，100段，血量递增
        let totalHp = 0;
        for(let i=0; i<this.count; i++) {
            let segHp = (i + 1) * (50 + wave * 30); // 第1段50+wave*30，第100段100*(50+wave*30)
            totalHp += segHp;
            this.segs.push({
                x: W/2, y: -120 + i*3,
                r: Math.max(8, this.r - i*0.3),
                hp: segHp, maxHp: segHp,
                hit: 0
            });
        }
        this.hp = totalHp;
        this.maxHp = totalHp;
        updateUI();
    }
    update() {
        if (!this.alive) return;
        
        // 蛇头 AI (S型曲线 + 向下推进)
        this.angle += this.spd * 0.06;
        this.headX = W/2 + Math.sin(this.angle) * (W * 0.35);
        // 持续向下推进
        this.baseY += 0.4;
        this.headY = this.baseY + Math.sin(G.time * 0.015) * 5;

        // 蛇身跟随 (链式物理)
        let last = {x: this.headX, y: this.headY};
        for (let s of this.segs) {
            let dx = last.x - s.x, dy = last.y - s.y;
            let d = Math.sqrt(dx*dx + dy*dy);
            if (d > 25) {
                let ratio = 25/d;
                s.x = last.x - dx*ratio;
                s.y = last.y - dy*ratio;
            }
            last = {x:s.x, y:s.y};
            if(s.hit > 0) s.hit--;
        }

        // 碰撞玩家 - 碰到用户线就输
        if (this.headY + this.r >= G.p.y) {
            G.p.hp = 0;
            G.shake = 15;
            G.addNum(G.p.x, G.p.y, '突破!', true, '#f00');
            gameover();
            updateUI();
        }
    }
    draw() {
        if (!this.alive) return;
        // 画身 - 鬼新娘风格（红黑配色）
        for (let i=this.segs.length-1; i>=0; i--) {
            let s = this.segs[i];
            if (s.hp <= 0) continue;
            X.beginPath(); X.arc(s.x, s.y, s.r, 0, Math.PI*2);
            X.fillStyle = s.hit > 0 ? '#fff' : `hsl(${340+i*2}, 80%, ${40+Math.max(0, s.hp/s.maxHp)*30}%)`;
            X.fill();
            X.strokeStyle = '#440022'; X.lineWidth = 1; X.stroke();
            // 段内血量数字（始终显示，带阴影）
            X.save();
            X.font = `bold ${Math.max(8, s.r*0.6)}px sans-serif`;
            X.textAlign = 'center'; X.textBaseline = 'middle';
            X.shadowColor = '#000'; X.shadowBlur = 3;
            X.fillStyle = '#fff';
            X.fillText(Math.ceil(s.hp), s.x, s.y);
            X.restore();
            // 血条（受伤时显示）
            if (s.hp < s.maxHp) {
                X.fillStyle = '#333'; X.fillRect(s.x-s.r, s.y-s.r-6, s.r*2, 3);
                X.fillStyle = '#ff4466'; X.fillRect(s.x-s.r, s.y-s.r-6, s.r*2*(s.hp/s.maxHp), 3);
            }
        }
        // 画头 - 鬼新娘风格
        X.save(); X.translate(this.headX, this.headY);
        X.beginPath(); X.arc(0, 0, this.r, 0, Math.PI*2);
        let g = X.createRadialGradient(0,0,5, 0,0,this.r);
        g.addColorStop(0, '#ff88aa'); g.addColorStop(1, '#440022');
        X.fillStyle = g; X.fill();
        // 眼
        X.fillStyle = '#f00'; X.beginPath(); X.arc(-8,-5, 5, 0, Math.PI*2); X.fill();
        X.beginPath(); X.arc(8,-5, 5, 0, Math.PI*2); X.fill();
        X.fillStyle = '#000'; X.beginPath(); X.arc(-8,-5, 2, 0, Math.PI*2); X.fill();
        X.beginPath(); X.arc(8,-5, 2, 0, Math.PI*2); X.fill();
        X.restore();
    }
}

function updateUI() {
    document.getElementById('score').textContent = G.score;
    let m = Math.floor(G.time/60/60), s = Math.floor(G.time/60)%60;
    document.getElementById('time').textContent = `${m}:${s<10?'0':''}${s}`;
    
    // Boss HP
    if (G.dragon) {
        let pct = Math.max(0, G.dragon.hp / G.dragon.maxHp * 100);
        document.getElementById('boss-hp-fill').style.width = pct + '%';
    }
    // Player HP
    if (G.p) {
        let php = Math.max(0, G.p.hp / G.p.maxHp * 100);
        document.getElementById('player-hp-fill').style.width = php + '%';
        document.getElementById('player-hp-text').textContent = `${Math.floor(G.p.hp)}/${G.p.maxHp}`;
    }
    // XP
    if (G.p) {
        document.getElementById('xp-fill').style.width = (G.p.xp / G.p.xpNext * 100) + '%';
    }
}

function gameover() {
    G.state = 'dead';
    document.getElementById('game-over').style.display = 'flex';
    document.getElementById('final-score').textContent = G.score;
}

G.dragonDie = function() {
    G.dragon.alive = false;
    G.score += 500 + G.wave * 200;
    G.addParticles(G.dragon.headX, G.dragon.headY, '#ff4466', 30);
    // 下一波
    setTimeout(() => {
        G.wave++;
        G.dragon = new Dragon(G.wave);
        let msg = document.getElementById('wave-msg');
        msg.textContent = `第 ${G.wave} 波`;
        msg.style.opacity = 1;
        setTimeout(() => msg.style.opacity = 0, 1500);
    }, 1000);
}

G.addParticles = function(x, y, c, n) {
    for(let i=0; i<n; i++) {
        G.particles.push({
            x, y, vx: (Math.random()-.5)*10, vy: (Math.random()-.5)*10, 
            life: 20, c: c, s: 2+Math.random()*3
        });
    }
}
G.addNum = function(x, y, d, crit, c) {
    G.nums.push({x, y, d, life: 30, crit, c: c||'#fff'});
}

// ==================== 8个原版技能 ====================
const SKILLS = [
    {name:'多发弹', icon:'🔥', desc:'攻击+1', fn:p=>p.count++},
    {name:'弹射+', icon:'💫', desc:'弹射次数+1', fn:p=>p.bounce++},
    {name:'穿透+', icon:'🎯', desc:'穿透+1', fn:p=>p.pierce++},
    {name:'伤害+', icon:'⚔️', desc:'伤害+5', fn:p=>p.dmg+=5},
    {name:'射速+', icon:'⚡', desc:'间隔-10%', fn:p=>p.rate=Math.max(5, p.rate*0.9)},
    {name:'暴击+', icon:'🎲', desc:'暴击+5%', fn:p=>p.crit=Math.min(.8, p.crit+.05)},
    {name:'减速弹', icon:'❄️', desc:'击中减速', fn:p=>{p.buffs.slow=true;}},
    {name:'灼烧弹', icon:'🔥', desc:'附加 DOT', fn:p=>{p.buffs.burn=true;}},
];

function showSkills() {
    G.state = 'skill';
    let menu = document.getElementById('skill-menu');
    let box = document.getElementById('skills');
    box.innerHTML = '';
    // 随机 3 个
    let pool = [...SKILLS].sort(()=>Math.random()-.5).slice(0,3);
    for(let s of pool) {
        let d = document.createElement('div');
        d.className = 'skill-card';
        d.innerHTML = `<div class="s-icon">${s.icon}</div><div><div class="s-name">${s.name}</div><div class="s-desc">${s.desc}</div></div>`;
        d.onclick = () => {
            s.fn(G.p);
            menu.style.display = 'none';
            G.state = 'play';
            updateBuffs();
        };
        box.appendChild(d);
    }
    menu.style.display = 'block';
}

function updateBuffs() {
    let bar = document.getElementById('buff-bar');
    let html = '';
    if (G.p.buffs.slow) html += '<div class="buff-item">❄️</div>';
    if (G.p.buffs.burn) html += '<div class="buff-item">🔥</div>';
    bar.innerHTML = html;
}

// 游戏循环
function loop() {
    if (G.state == 'play') {
        G.time++; G.frame++;
        G.p.update();
        G.dragon.update();

        // 更新子弹
        G.bullets = G.bullets.filter(b => b.update());

        // 粒子更新
        G.particles = G.particles.filter(p => {
            p.x += p.vx; p.y += p.vy; p.life--;
            return p.life > 0;
        });

        // 升级
        // XP 获取（降低频率，5帧+1）
        G.p.xp += G.frame % 5 === 0 ? 1 : 0;
        if (G.p.xp >= G.p.xpNext) {
            G.p.xp -= G.p.xpNext;
            G.p.lv++;
            G.p.xpNext = Math.floor(G.p.xpNext * 1.4);
            showSkills();
        }

        if(G.shake>0) G.shake*=.9;
    }

    // 蛇持续移动和碰撞检测（即使升级界面也不停）
    if (G.dragon && G.dragon.alive && G.state !== 'dead') {
        G.dragon.update();
    }

    // 渲染
    X.fillStyle = '#050510'; X.fillRect(0,0,W,H);
    X.save();
    if(G.shake>0.5) X.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake);
    
    // 网格背景
    X.strokeStyle = 'rgba(255,255,255,0.05)';
    for(let i=0; i<W; i+=50){ X.beginPath(); X.moveTo(i,0); X.lineTo(i,H); X.stroke(); }
    
    if(G.dragon) G.dragon.draw();
    if(G.p) G.p.draw();
    G.bullets.forEach(b => b.draw());
    G.particles.forEach(p => {
        X.fillStyle = p.c; X.beginPath(); X.arc(p.x,p.y,p.s,0,Math.PI*2); X.fill();
    });
    G.nums = G.nums.filter(n => {
        n.y -= 2; n.life--;
        X.fillStyle = n.c; X.font = `bold ${n.crit?22:14}px sans-serif`; X.textAlign='center';
        X.fillText(n.d, n.x, n.y);
        return n.life > 0;
    });
    X.restore();
    
    requestAnimationFrame(loop);
}

// 初始化
G.p = new Player();
G.dragon = new Dragon(1);

// 重新开始
document.getElementById('restart-btn').onclick = function() {
    G.state = 'play'; G.time = 0; G.frame = 0; G.score = 0; G.shake = 0; G.wave = 0;
    G.bullets = []; G.particles = []; G.nums = [];
    G.p = new Player();
    G.dragon = new Dragon(1);
    document.getElementById('game-over').style.display = 'none';
    updateUI();
};

loop();
</script>
</body>
</html>
