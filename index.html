<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>看谁能打过 - 弹射打龙</title>
<style>
* { box-sizing: border-box; }
body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; touch-action:none; color:#fff; }
canvas { display:block; background:#050510; }
.screen { position:absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; pointer-events:auto; }
.screen.active { display:flex; }

/* === 主菜单 === */
#menu-screen { background: linear-gradient(180deg, #0a0a2e, #1a0a0a); justify-content:center; align-items:center; gap:12px; }
#menu-screen h1 { font-size:36px; color:#ff3333; text-shadow:0 0 20px red; margin-bottom:5px; }
#menu-screen .subtitle { color:#aaa; font-size:14px; margin-bottom:20px; }
.menu-btn { width:80%; max-width:300px; padding:14px; border:2px solid; border-radius:12px; background:rgba(0,0,0,0.5);
    color:#fff; font-size:18px; font-weight:bold; cursor:pointer; text-align:center; transition:0.2s; }
.menu-btn:active { transform:scale(0.96); }
.menu-btn.start { border-color:#00ff88; background:rgba(0,255,136,0.15); color:#00ff88; font-size:22px; }
.menu-btn.shop { border-color:#ffcc00; color:#ffcc00; }
.menu-btn.equip { border-color:#00ccff; color:#00ccff; }
.menu-btn.stats { border-color:#cc66ff; color:#cc66ff; }
#menu-currency { display:flex; gap:20px; font-size:16px; margin-bottom:10px; }
#menu-currency span { padding:4px 12px; border-radius:20px; }
.gold-display { background:rgba(255,200,0,0.2); border:1px solid #ffcc00; }
.diamond-display { background:rgba(0,150,255,0.2); border:1px solid #00aaff; }

/* === 商店 === */
#shop-screen { background:rgba(0,0,0,0.95); padding:20px; }
#shop-screen h2 { text-align:center; color:#ffcc00; font-size:24px; margin-bottom:15px; }
.shop-item { display:flex; align-items:center; padding:12px; margin:8px 0; background:rgba(30,30,60,0.8);
    border:1px solid #444; border-radius:10px; justify-content:space-between; }
.shop-item .info { flex:1; }
.shop-item .info h3 { margin:0; color:#fff; font-size:16px; }
.shop-item .info p { margin:2px 0 0; color:#aaa; font-size:12px; }
.shop-btn { padding:8px 16px; border:1px solid #ffcc00; background:rgba(255,200,0,0.15); color:#ffcc00;
    border-radius:8px; cursor:pointer; font-size:14px; }
.back-btn { margin-top:auto; margin-bottom:20px; padding:12px; border:1px solid #888; background:rgba(100,100,100,0.2);
    color:#fff; border-radius:10px; cursor:pointer; text-align:center; font-size:16px; }

/* === 装备 === */
#equip-screen { background:rgba(0,0,0,0.95); padding:20px; }
#equip-screen h2 { text-align:center; color:#00ccff; font-size:24px; margin-bottom:15px; }
.weapon-card { display:flex; align-items:center; padding:12px; margin:8px 0; background:rgba(30,30,60,0.8);
    border:1px solid #444; border-radius:10px; }
.weapon-card.unlocked { border-color:#00ff88; }
.weapon-card .w-icon { font-size:32px; margin-right:12px; }
.weapon-card .w-info h3 { margin:0; font-size:15px; }
.weapon-card .w-info p { margin:2px 0 0; color:#aaa; font-size:12px; }

/* === 永久升级 === */
#upgrade-panel { position:absolute; top:60px; left:10px; right:10px; background:rgba(0,0,0,0.9);
    border:1px solid #ffcc00; border-radius:12px; padding:15px; display:none; z-index:200; }
.upgrade-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #333; }
.upgrade-row:last-child { border:none; }
.upgrade-btn { padding:6px 12px; background:rgba(255,200,0,0.2); border:1px solid #ffcc00; color:#ffcc00;
    border-radius:6px; cursor:pointer; font-size:12px; }

/* === 战斗UI === */
#battle-ui { pointer-events:none; }
#progress-container { position:absolute; top:8px; left:5%; width:90%; height:16px; }
#progress-bar { width:100%; height:100%; background:#222; border-radius:8px; overflow:hidden; border:1px solid #555; }
#progress-fill { height:100%; background:linear-gradient(90deg,#00ff88,#00ffff); width:0%; transition:width 0.5s; }
#progress-text { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.8); }

#boss-hp-container { position:absolute; top:30px; left:5%; width:90%; height:20px; display:none; }
#boss-hp-bg { width:100%; height:14px; background:#333; border:2px solid #555; border-radius:7px; overflow:hidden; }
#boss-hp-fill { height:100%; background:linear-gradient(90deg,#ff0000,#ff6600); width:100%; transition:width 0.1s; }
#boss-name { text-align:center; color:#ff3333; font-size:14px; margin-bottom:2px; text-shadow:0 0 5px red; }

#pause-btn { position:absolute; top:8px; right:10px; pointer-events:auto; padding:6px 14px;
    background:rgba(0,0,0,0.6); border:1px solid #888; border-radius:8px; color:#fff; cursor:pointer; font-size:16px; }

#weapon-bar { position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    display:flex; gap:4px; pointer-events:auto; }
.weapon-slot { width:44px; height:44px; background:rgba(20,20,40,0.9); border:2px solid #555;
    border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:10px; color:#aaa; position:relative; }
.weapon-slot .icon { font-size:18px; }

#player-hp-container { position:absolute; bottom:6px; left:5%; width:90%; height:16px; }
#player-hp-bg { width:100%; height:100%; background:#333; border:1px solid #555; border-radius:5px; overflow:hidden; }
#player-hp-fill { height:100%; background:linear-gradient(90deg,#00ff88,#00ffff); width:100%; transition:width 0.1s; }

#gold-display { position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:14px;
    color:#ffcc00; pointer-events:none; display:none; }

/* === 技能菜单 === */
#skill-menu { background:rgba(0,0,0,0.92); justify-content:center; align-items:center; gap:8px; z-index:300; }
#skill-menu h2 { color:#00ff88; font-size:22px; text-shadow:0 0 10px #00ff88; margin:0; }
#skill-menu .sub { color:#aaa; font-size:13px; margin:0; }
.skill-card { width:88%; max-width:400px; background:linear-gradient(135deg,#1a1a3a,#0a0a2a);
    border:2px solid #336; border-radius:12px; padding:14px; display:flex; align-items:center; cursor:pointer;
    box-shadow:0 4px 15px rgba(0,100,255,0.3); }
.skill-card:active { transform:scale(0.97); }
.skill-card .s-icon { font-size:30px; margin-right:12px; }
.skill-card .s-info h3 { margin:0; color:#00ffff; font-size:15px; }
.skill-card .s-info p { margin:3px 0 0; color:#bbb; font-size:12px; }
.rarity { font-size:9px; padding:1px 5px; border-radius:3px; margin-top:3px; display:inline-block; }
.r-common { background:#555; } .r-rare { background:#06c; } .r-epic { background:#a0c; } .r-legendary { background:#c60; }
.skill-level { font-size:10px; color:#ffcc00; margin-left:6px; }

/* === 结算面板 === */
#settle-screen { background:rgba(0,0,0,0.95); justify-content:center; align-items:center; gap:12px; z-index:400; }
#settle-screen h2 { font-size:32px; margin:0; }
.settle-win { color:#00ff88; text-shadow:0 0 15px #00ff88; }
.settle-lose { color:#ff3333; text-shadow:0 0 15px red; }
.settle-stats { font-size:16px; color:#aaa; text-align:center; }
.settle-btn { width:80%; max-width:280px; padding:14px; border-radius:12px; font-size:18px;
    font-weight:bold; cursor:pointer; text-align:center; }
.settle-btn.double { border:2px solid #ffcc00; background:rgba(255,200,0,0.15); color:#ffcc00; }
.settle-btn.retry { border:2px solid #00ff88; background:rgba(0,255,136,0.15); color:#00ff88; }

/* === 离线收益 === */
#offline-screen { background:rgba(0,0,0,0.95); justify-content:center; align-items:center; gap:12px; z-index:500; }
#offline-screen h2 { color:#ffcc00; font-size:24px; margin:0; }
.offline-reward { font-size:18px; color:#00ff88; text-align:center; }

/* === 暂停 === */
#pause-menu { background:rgba(0,0,0,0.85); justify-content:center; align-items:center; gap:15px; z-index:250; }
#pause-menu h2 { color:#fff; font-size:28px; margin:0; }
.pause-btn { width:60%; max-width:250px; padding:12px; border-radius:10px; font-size:16px;
    cursor:pointer; text-align:center; border:1px solid #888; background:rgba(100,100,100,0.2); color:#fff; }

/* === 战力显示 === */
#power-display { position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
    color:#aaa; font-size:12px; pointer-events:none; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- 主菜单 -->
<div id="menu-screen" class="screen active">
    <h1>🐉 看谁能打过</h1>
    <div class="subtitle">Roguelike 策略射击</div>
    <div id="menu-currency">
        <span class="gold-display">💰 <span id="menu-gold">0</span></span>
        <span class="diamond-display">💎 <span id="menu-diamond">0</span></span>
    </div>
    <button class="menu-btn start" onclick="startGame()">⚔️ 开始战斗</button>
    <button class="menu-btn equip" onclick="showScreen('equip-screen')">🔧 装备</button>
    <button class="menu-btn shop" onclick="showScreen('shop-screen')">🛒 商店</button>
    <button class="menu-btn stats" onclick="toggleUpgradePanel()">📈 永久升级</button>
    <div id="power-display">推荐战力: <span id="power-val">100</span></div>
</div>

<!-- 商店 -->
<div id="shop-screen" class="screen">
    <h2>🛒 商店</h2>
    <div class="shop-item"><div class="info"><h3>🗝️ 扫荡券 x3</h3><p>快速完成3场战斗</p></div><button class="shop-btn" onclick="buyItem('sweep',100)">💰100</button></div>
    <div class="shop-item"><div class="info"><h3>🎁 随机武器箱</h3><p>解锁一把新武器</p></div><button class="shop-btn" onclick="buyItem('weaponbox',500)">💰500</button></div>
    <div class="shop-item"><div class="info"><h3>💎 钻石 x10</h3><p>稀缺货币，用于抽卡</p></div><button class="shop-btn" onclick="buyItem('diamonds',50)">💰50</button></div>
    <button class="back-btn" onclick="showScreen('menu-screen')">← 返回</button>
</div>

<!-- 装备 -->
<div id="equip-screen" class="screen">
    <h2>🔧 装备</h2>
    <div id="equip-list"></div>
    <button class="back-btn" onclick="showScreen('menu-screen')">← 返回</button>
</div>

<!-- 永久升级面板 -->
<div id="upgrade-panel">
    <h3 style="margin:0 0 10px;color:#ffcc00;">📈 永久升级</h3>
    <div class="upgrade-row"><span>❤️ 生命上限 Lv.<span id="up-hp-lv">1</span></span><button class="upgrade-btn" onclick="upgradeStat('hp')">💰<span id="up-hp-cost">50</span></button></div>
    <div class="upgrade-row"><span>⚔️ 基础攻击 Lv.<span id="up-atk-lv">1</span></span><button class="upgrade-btn" onclick="upgradeStat('atk')">💰<span id="up-atk-cost">50</span></button></div>
    <div class="upgrade-row"><span>⚡ 攻击速度 Lv.<span id="up-spd-lv">1</span></span><button class="upgrade-btn" onclick="upgradeStat('spd')">💰<span id="up-spd-cost">50</span></button></div>
    <button class="back-btn" style="margin:10px 0 0;padding:8px;" onclick="toggleUpgradePanel()">关闭</button>
</div>

<!-- 战斗UI -->
<div id="battle-ui" class="screen">
    <div id="progress-container">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text">关卡 1 - 进度 0%</div>
    </div>
    <div id="gold-display">💰 <span id="battle-gold">0</span></div>
    <div id="boss-hp-container"><div id="boss-name">🐉 Boss</div><div id="boss-hp-bg"><div id="boss-hp-fill"></div></div></div>
    
    <div id="weapon-bar"></div>
    <div id="player-hp-container"><div id="player-hp-bg"><div id="player-hp-fill"></div></div></div>
    <button id="pause-btn" onclick="showPauseMenu()">⏸</button>
</div>

<!-- 技能选择 -->
<div id="skill-menu" class="screen">
    <h2>⬆️ 选择强化</h2>
    <p class="sub" id="skill-sub-info">等级 2</p>
    <div id="skills-container" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
</div>

<!-- 暂停菜单 -->
<div id="pause-menu" class="screen">
    <h2>⏸ 暂停</h2>
    <button class="pause-btn" onclick="hidePauseMenu()">▶ 继续战斗</button>
    <button class="pause-btn" onclick="showScreen('menu-screen');hidePauseMenu();gameState='gameover';">🏠 返回主页</button>
</div>

<!-- 结算面板 -->
<div id="settle-screen" class="screen">
    <h2 id="settle-title"></h2>
    <div class="settle-stats" id="settle-stats"></div>
    <button class="settle-btn double" onclick="doubleReward()">📺 双倍奖励</button>
    <button class="settle-btn retry" onclick="showScreen('menu-screen');initMenu();">🔄 再来一局</button>
</div>

<!-- 离线收益 -->
<div id="offline-screen" class="screen">
    <h2>🎁 离线收益</h2>
    <div class="offline-reward" id="offline-reward"></div>
    <button class="settle-btn retry" onclick="showScreen('menu-screen');initMenu();">领取</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W=window.innerWidth; H=window.innerHeight; canvas.width=W; canvas.height=H; }
window.addEventListener('resize', resize); resize();

// ========== 存档系统 ==========
let save = {
    gold: 0, diamonds: 0,
    upgrades: { hp:1, atk:1, spd:1 },
    weapons: ['basic'],
    equipped: 'basic',
    lastOnline: Date.now(),
    totalKills: 0,
    highestLevel: 0
};

function loadSave(){
    try { const s=localStorage.getItem('game_save'); if(s) save=JSON.parse(s); } catch(e){}
}
function saveGame(){ save.lastOnline=Date.now(); localStorage.setItem('game_save',JSON.stringify(save)); }
loadSave();

// 离线收益
function checkOffline(){
    const elapsed = (Date.now() - save.lastOnline) / 1000;
    if(elapsed > 60){
        const goldEarned = Math.floor(elapsed * 0.5 * (1 + save.upgrades.atk * 0.1));
        const diamondsEarned = Math.floor(elapsed * 0.01);
        save.gold += goldEarned;
        save.diamonds += diamondsEarned;
        document.getElementById('offline-reward').innerHTML = `离线 ${Math.floor(elapsed/60)} 分钟<br>获得 💰${goldEarned} 金币<br>获得 💎${diamondsEarned} 钻石`;
        showScreen('offline-screen');
        saveGame();
    }
}

// ========== 屏幕切换 ==========
function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    const el=document.getElementById(id); if(el) el.classList.add('active');
    if(id==='menu-screen') initMenu();
    if(id==='equip-screen') renderEquip();
}

function initMenu(){
    document.getElementById('menu-gold').innerText = save.gold;
    document.getElementById('menu-diamond').innerText = save.diamonds;
    const power = save.upgrades.atk*20 + save.upgrades.hp*10 + save.upgrades.spd*15 + save.weapons.length*50;
    document.getElementById('power-val').innerText = power;
}

// ========== 商店 ==========
function buyItem(type, cost){
    if(save.gold < cost) return alert('金币不足!');
    save.gold -= cost;
    if(type==='sweep') { save.gold += 200; alert('扫荡完成! 获得 💰200'); }
    else if(type==='weaponbox'){
        const allW = ['basic','pill','syringe','dagger','satellite','tide_stone','med_swab','lab_mouth'];
        const available = allW.filter(w=>!save.weapons.includes(w));
        if(available.length){ const w=available[Math.floor(Math.random()*available.length)]; save.weapons.push(w); alert(`获得新武器: ${WEAPONS[w].name}`); }
        else alert('所有武器已解锁!');
    }
    else if(type==='diamonds') { save.diamonds += 10; alert('获得 💎10'); }
    saveGame(); initMenu();
}

// ========== 永久升级 ==========
function toggleUpgradePanel(){
    const p=document.getElementById('upgrade-panel');
    p.style.display = p.style.display==='block'?'none':'block';
    renderUpgradePanel();
}
function renderUpgradePanel(){
    const u=save.upgrades;
    document.getElementById('up-hp-lv').innerText=u.hp;
    document.getElementById('up-atk-lv').innerText=u.atk;
    document.getElementById('up-spd-lv').innerText=u.spd;
    document.getElementById('up-hp-cost').innerText=u.hp*50;
    document.getElementById('up-atk-cost').innerText=u.atk*50;
    document.getElementById('up-spd-cost').innerText=u.spd*50;
}
function upgradeStat(stat){
    const cost = save.upgrades[stat]*50;
    if(save.gold<cost) return alert('金币不足!');
    save.gold -= cost;
    save.upgrades[stat]++;
    saveGame(); renderUpgradePanel(); initMenu();
}

// ========== 装备 ==========
const WEAPONS = {
    basic: { name:'基础弹', icon:'💥', desc:'垂直发射子弹', tier:'T3', effect:{} },
    pill: { name:'药丸', icon:'💊', desc:'高触发率，随机特效', tier:'T1', effect:{ triggerRate:0.15 } },
    syringe: { name:'针灸', icon:'🪡', desc:'穿透+分裂', tier:'T0', effect:{ pierce:2, splitChance:0.2 } },
    dagger: { name:'旋转匕首', icon:'🗡️', desc:'近战环形攻击', tier:'T2', effect:{ melee:true, range:80, rate:30 } },
    satellite: { name:'卫星风暴', icon:'🛰️', desc:'范围爆发', tier:'T1', effect:{ aoe:true, radius:60, rate:90 } },
    tide_stone: { name:'潮汐之石', icon:'🌊', desc:'减速控场', tier:'T2', effect:{ slow:0.7, rate:40 } },
    med_swab: { name:'医用棉签', icon:'🩹', desc:'Boss双倍伤害+控制', tier:'T0', effect:{ bossDmg:2, stunChance:0.1 } },
    lab_mouth: { name:'实验之口', icon:'👄', desc:'大范围持续伤害', tier:'T0', effect:{ continuous:true, radius:100, rate:60 } },
};

function renderEquip(){
    const list = document.getElementById('equip-list');
    list.innerHTML = '';
    Object.keys(WEAPONS).forEach(k => {
        const w = WEAPONS[k];
        const unlocked = save.weapons.includes(k);
        const equipped = save.equipped === k;
        const card = document.createElement('div');
        card.className = 'weapon-card' + (unlocked ? ' unlocked' : '');
        card.innerHTML = `<div class="w-icon">${w.icon}</div><div class="w-info"><h3>${w.name} <span style="color:${w.tier==='T0'?'#ff6600':w.tier==='T1'?'#ffcc00':'#888'}">[${w.tier}]</span></h3><p>${w.desc}</p>${!unlocked?'<p style="color:#f44">🔒 未解锁</p>':equipped?'<p style="color:#0f8">✅ 已装备</p>':''}</div>`;
        if(unlocked && !equipped){
            const btn = document.createElement('button');
            btn.style.cssText='padding:6px 12px;background:rgba(0,255,136,0.2);border:1px solid #0f8;color:#0f8;border-radius:6px;cursor:pointer;';
            btn.innerText = '装备';
            btn.onclick = () => { save.equipped=k; saveGame(); renderEquip(); };
            card.appendChild(btn);
        }
        list.appendChild(card);
    });
}

function getPlayerStats(){
    const w = WEAPONS[save.equipped] || WEAPONS.basic;
    return {
        hp: 1000 + (save.upgrades.hp-1)*200,
        damage: 50 + (save.upgrades.atk-1)*20,
        fireRate: Math.max(5, 25 - (save.upgrades.spd-1)*3),
        weapon: w
    };
}

// ========== 战斗系统 ==========
let gameState = 'menu';
let player, boss, bullets, angels, particles, damageNums;
let currentLevel = 1, levelTime = 0, levelDuration = 3600;
let battleGold = 0;
let skills = {}; // { skillId: level }  技能升级系统，最高3级
let lastSettleReward = 0;

// ========== 30种技能词条（含多级效果） ==========
const ALL_SKILLS = [
    // === 弹幕流 ===
    { id:'dmg15', name:'🔥 伤害+15%', desc:'基础伤害+15%', icon:'🔥', rarity:'common', cat:'攻击',
      levels:[
        {apply:()=>{player.damage=Math.floor(player.damage*1.15);}, desc:'+15%'},
        {apply:()=>{player.damage=Math.floor(player.damage*1.25);}, desc:'再+25% (总+44%)'},
        {apply:()=>{player.damage=Math.floor(player.damage*1.40);}, desc:'再+40% (总+101%)'},
      ]},
    { id:'dmg30', name:'💥 伤害+30%', desc:'基础伤害+30%', icon:'💥', rarity:'rare', cat:'攻击',
      levels:[
        {apply:()=>{player.damage=Math.floor(player.damage*1.30);}, desc:'+30%'},
        {apply:()=>{player.damage=Math.floor(player.damage*1.40);}, desc:'再+40%'},
        {apply:()=>{player.damage=Math.floor(player.damage*1.50);}, desc:'再+50%'},
      ]},

// 获取技能当前等级
function getSkillLevel(id){ return skills[id] || 0; }
// 获取技能最高等级
function isSkillMaxed(id){ return (skills[id]||0) >= 3; }

function getRandomSkills(count){
    let pool = ALL_SKILLS.filter(s => !isSkillMaxed(s.id));
    // 优先显示已有的技能（可以升级）
    let existing = pool.filter(s => getSkillLevel(s.id) > 0);
    let newOnes = pool.filter(s => getSkillLevel(s.id) === 0);
    
    let result = [];
    // 至少给1个可升级的（如果有）
    if(existing.length > 0 && result.length < count){
        let idx = Math.floor(Math.random()*existing.length);
        result.push(existing.splice(idx,1)[0]);
    }
    while(result.length < count && pool.length > 0){
        let idx = Math.floor(Math.random()*pool.length);
        result.push(pool.splice(idx,1)[0]);
    }
    return result;
}

function showSkillSelect(reason){
    gameState = 'skillSelect';
    const container = document.getElementById('skills-container');
    container.innerHTML = '';
    document.getElementById('skill-sub-info').innerText = reason;
    const sks = getRandomSkills(3);
    sks.forEach(skill => {
        const card = document.createElement('div');
        card.className = 'skill-card';
        const rClass = `r-${skill.rarity}`;
        const rLabel = {common:'普通',rare:'稀有',epic:'史诗',legendary:'传说'}[skill.rarity];
        const curLv = getSkillLevel(skill.id);
        const nextLv = curLv + 1;
        const levelInfo = curLv > 0 ? ` [Lv.${curLv}→${nextLv}]` : ` [新→Lv.1]`;
        const effectDesc = skill.levels[curLv].desc;
        card.innerHTML = `<div class="s-icon">${skill.icon}</div><div class="s-info"><h3>${skill.name}${levelInfo}</h3><p>${skill.desc}</p><p style="color:#0f8;margin-top:2px;font-size:11px;">→ ${effectDesc}</p><span class="rarity ${rClass}">[${rLabel}] ${skill.cat}</span></div>`;
        card.onclick = () => { 
            skill.levels[curLv].apply(); 
            skills[skill.id] = nextLv;
            updateWeaponBar(); 
            hideSkillSelect(); 
        };
        container.appendChild(card);
    });
    showScreen('skill-menu');
}

function initLevel(){
    levelTime=0;
    levelDuration = 3600 + currentLevel * 200;
    generateBoss();
    updateProgress();
}

function generateBoss(){
    const isBossLevel = currentLevel % 5 === 0;
    const bossHP = isBossLevel ? 15000 + currentLevel*2000 : 5000 + currentLevel*500;
    const bossSpeed = (1.5 + currentLevel*0.02) * (player.slowBoss||1);
    boss = {
        isBoss: isBossLevel,
        headX:W/2, headY:-100,
        hp:bossHP, maxHp:bossHP, speed:bossSpeed,
        radius: isBossLevel ? 30 : 25,
        amplitude:180, frequency:0.03,
        segments:[], segmentCount:120,
        name: isBossLevel ? `🐉 邪龙Boss Lv.${currentLevel}` : `🐍 病毒Lv.${currentLevel}`,
    // 宝箱节点：追踪"距离头部第几段"而不是数组index（因为index会变）
    chestDistances: [], // 距离头部的段数偏移
    update:bossUpdate, draw:bossDraw, takeDamage:bossTakeDamage
};
// 初始化蛇身体
initSnakeBody();
// 标记宝箱在蛇身体上的位置
markChestSegments();

function markChestSegments(){
    // 根据 chestDistances 重新计算当前哪些数组index是宝箱段
    boss.chestSegments = [];
    for(let d of boss.chestDistances){
        let idx = d % boss.segments.length;
        if(idx < boss.segments.length && !boss.chestSegments.includes(idx)){
            boss.chestSegments.push(idx);
        }
    }
}

document.getElementById('boss-hp-container').style.display='block';
document.getElementById('boss-name').innerText = boss.name;
}

// 初始化蛇身体并设置宝箱距离
function initSnakeBody(){
    boss.segments = [];
    boss.chestDistances = [];
    for(let i=0; i<boss.segmentCount; i++){
        boss.segments.push({x:W/2, y:-100-i*10, alive:true});
    }
    // 每4-6段随机一个宝箱（距离头部的段数）
    let pos = 4 + Math.floor(Math.random()*3);
    while(pos < 80){
        boss.chestDistances.push(pos);
        pos += 4 + Math.floor(Math.random()*3);
    }
}

function bossUpdate(){
    if(!boss) return;
    // 原版逻辑：蛇持续向下走
    boss.headY += boss.speed;
    // S型横向走位
    boss.headX = W/2 + Math.sin(boss.headY*boss.frequency + levelTime*0.02) * boss.amplitude;
    if(boss.headX<boss.radius) boss.headX=boss.radius;
    if(boss.headX>W-boss.radius) boss.headX=W-boss.radius;
    // 蛇头超出屏幕底部，重置到顶部
    if(boss.headY > H + 50){
        boss.headY = -100;
        boss.segments = [];
        for(let i=0;i<boss.segmentCount;i++) boss.segments.push({x:W/2, y:-100-i*10, alive:true});
    }

    let last=boss.segments[0];
    let dist=Math.hypot(boss.headX-last.x, boss.headY-last.y);
    if(dist>8){
        boss.segments.unshift({x:boss.headX, y:boss.headY, alive:true});
        if(boss.segments.length>boss.segmentCount) boss.segments.pop();
    }
    // 每帧重新标记宝箱段位置
    markChestSegments();
    // 碰撞玩家
    if(boss.headY > player.y-100){
        let d=Math.hypot(boss.headX-player.x, boss.headY-player.y);
        if(d < boss.radius+player.radius){
            if(player.dodgeRate && Math.random()<player.dodgeRate){
                showDamage(player.x,player.y,'闪避!',false);
            } else {
                player.hp -= 100; screenShake=15;
                showDamage(player.x,player.y,100,true);
                if(player.hp<=0){
                    if(player.hasShield){ 
                        player.hasShield=false; player.hp=player.maxHp*0.3; 
                        showDamage(player.x,player.y,'护盾!',false); 
                    }
                    else gameOver();
                }
            }
        }
    }
}

function bossDraw(){
    if(!boss) return;
    const color = boss.isBoss ? '#ff4444' : '#00ff00';
    const borderColor = boss.isBoss ? '#ff8888' : '#ffffff';
    for(let i=boss.segments.length-1;i>=0;i--){
        let s=boss.segments[i];
        if(!s.alive) continue;
        // 宝箱节点高亮
        let isChest = boss.chestSegments.includes(i);
        let r = boss.radius*(1-(i/boss.segmentCount)*0.6);
        if(r<5) r=5;
        let flicker = Math.sin(levelTime*0.2+i*0.1)*0.1;
        ctx.beginPath(); ctx.arc(s.x,s.y, isChest ? r+4 : r, 0, Math.PI*2);
        if(isChest){
            // 宝箱段发光+宝箱图标
            let pulse = 0.5 + Math.sin(levelTime*0.3)*0.3;
            ctx.fillStyle=`rgba(255,200,0,${pulse})`; ctx.shadowBlur=15; ctx.shadowColor='#ffcc00';
        } else {
            ctx.fillStyle=color; ctx.globalAlpha=0.6+flicker;
        }
        ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0;
        ctx.strokeStyle=isChest?'#fff':borderColor; ctx.lineWidth=2; ctx.stroke();
        if(isChest){ 
            ctx.font='16px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; 
            ctx.fillText('🎁',s.x,s.y); 
        }
    }
    // 头部
    ctx.save(); ctx.translate(boss.headX, boss.headY);
    for(let t=0;t<6;t++){
        let angle=(t/6)*Math.PI*2+levelTime*0.1;
        let len=40+Math.sin(levelTime*0.3+t)*10;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.quadraticCurveTo(Math.cos(angle)*len*0.5+Math.sin(levelTime*0.5)*10, Math.sin(angle)*len*0.5, Math.cos(angle)*len, Math.sin(angle)*len);
        ctx.strokeStyle=boss.isBoss?'#ff4444':'#00ff00'; ctx.lineWidth=4; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,boss.radius*1.5,0,Math.PI*2);
    let g=ctx.createRadialGradient(-5,-5,5,0,0,boss.radius*1.5);
    g.addColorStop(0,'#fff'); g.addColorStop(0.5,boss.isBoss?'#ff4444':'#00ff00'); g.addColorStop(1,'#000');
    ctx.fillStyle=g; ctx.fill();
    ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(-10,-5,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10,-5,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-10,-5,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10,-5,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

function bossTakeDamage(dmg){
    if(dmg<=0) return;
    let actualDmg = dmg;
    if(player.weapon?.effect?.bossDmg && boss.isBoss) actualDmg *= player.weapon.effect.bossDmg;
    if(Math.random() < (player.critRate||0)) { actualDmg *= (player.critMult||2); showDamage(boss.headX,boss.headY-30,Math.floor(actualDmg),true); }
    else showDamage(boss.headX,boss.headY-30,Math.floor(actualDmg),false);
    boss.hp -= actualDmg;
    screenShake = Math.min(10,screenShake+1);
    for(let k=0;k<3;k++) particles.push({x:boss.headX,y:boss.headY,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:20,color:boss.isBoss?'#ff4444':'#00ff00',size:3+Math.random()*5});
    document.getElementById('boss-hp-fill').style.width = (Math.max(0,boss.hp/boss.maxHp)*100)+'%';
    if(player.hasPoison && !boss.poisoned) { boss.poisoned=player.poisonDur||3; boss.poisonDmg=player.poisonDmg||2; }
    if(player.hasBurn && !boss.burning) { boss.burning=player.burnDur||2; boss.burnDmg=player.burnDmg||3; }
    if(boss.hp<=0) {
        battleGold += 50 + currentLevel*20;
        nextLevel();
    }
}

function nextLevel(){
    currentLevel++;
    initLevel();
    showSkillSelect(`第 ${currentLevel} 关 - 选择强化`);
}

function gameOver(){
    gameState='gameover';
    showSettlement(false);
}

function updateProgress(){
    const pct = Math.min(100, Math.floor(levelTime / levelDuration * 100));
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').innerText = `关卡 ${currentLevel} - 进度 ${pct}%`;
    if(pct >= 100){
        battleGold += 100 + currentLevel*30;
        showSettlement(true);
    }
}

// ========== 视觉 ==========
function drawPlayer(){
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.rotate(levelTime*0.05);
    ctx.beginPath(); ctx.arc(0,0,player.radius+5,0,Math.PI*1.5);
    ctx.strokeStyle='#00ffff'; ctx.lineWidth=4; ctx.shadowBlur=10; ctx.shadowColor='#00ffff'; ctx.stroke();
    ctx.shadowBlur=0; ctx.rotate(-levelTime*0.05);
    let grad=ctx.createRadialGradient(0,-5,5,0,0,player.radius);
    grad.addColorStop(0,'rgba(255,255,255,0.8)'); grad.addColorStop(0.4,'rgba(0,255,255,0.6)');
    grad.addColorStop(1,'rgba(0,100,255,0.1)');
    ctx.beginPath(); ctx.arc(0,0,player.radius,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.shadowBlur=15; ctx.shadowColor='#fff'; ctx.fill();
    ctx.restore();
}

function showDamage(x,y,dmg,isCrit){
    damageNums.push({x:x+(Math.random()-0.5)*20, y:y, val:isCrit?'💥'+dmg:dmg, life:40, color:isCrit?'#ffff00':'#ffffff', size:isCrit?24:16, vy:-2});
}

function updateWeaponBar(){
    const bar = document.getElementById('weapon-bar');
    bar.innerHTML = '';
    const slots = [];
    slots.push({icon:'💥', label:'基础'});
    if(player.bulletCount>1) slots.push({icon:'🔱', label:`x${player.bulletCount}`});
    if(player.pierce>0) slots.push({icon:'💎', label:`穿${player.pierce}`});
    if(player.hasExplode) slots.push({icon:'💣', label:'爆'});
    if(player.hasFreeze) slots.push({icon:'❄️', label:'冰'});
    if(player.hasLightning) slots.push({icon:'⚡', label:'链'});
    if(player.hasPoison) slots.push({icon:'🧪', label:'毒'});
    if(player.hasBurn) slots.push({icon:'🔥', label:'燃'});
    if(player.hasAOE) slots.push({icon:'🌀', label:'AOE'});
    if(player.hasHoming) slots.push({icon:'🎯', label:'追踪'});
    if(player.hasSplit) slots.push({icon:'✂️', label:'分裂'});
    if(player.hasAngel) slots.push({icon:'👼', label:`x${player.angelCount}`});
    if(player.hasShield) slots.push({icon:'🛡️', label:'盾'});
    if(player.critRate>0) slots.push({icon:'⭐', label:`暴${Math.floor((player.critRate||0)*100)}%`});
    // 显示技能等级
    for(let id in skills){
        if(skills[id]>0){
            const sk = ALL_SKILLS.find(s=>s.id===id);
            if(sk) slots.push({icon:sk.icon, label:`Lv.${skills[id]}`});
        }
    }
    for(let i=0; i<Math.min(8,slots.length); i++){
        const s = document.createElement('div');
        s.className = 'weapon-slot';
        s.innerHTML = `<span class="icon">${slots[i].icon}</span><span style="font-size:8px">${slots[i].label}</span>`;
        bar.appendChild(s);
    }
    document.getElementById('battle-gold').innerText = battleGold;
}

// 输入
let inputX = W/2;
const keys = {};
window.addEventListener('keydown', e => keys[e.key]=true);
window.addEventListener('keyup', e => keys[e.key]=false);
window.addEventListener('mousemove', e => inputX=e.clientX);
window.addEventListener('touchmove', e => {if(e.touches.length) inputX=e.touches[0].clientX;}, {passive:true});

let screenShake = 0;

// ========== 主循环 ==========
let running = false;
function gameLoop(){
    if(!running) { running=true; requestAnimationFrame(loop); }
}

function loop(){
    if(gameState==='playing'){
        levelTime++;
        // 生命恢复
        if(player.hasRegen){
            let rate = player.regenRate || 0.01;
            if(player.hp < player.maxHp*0.3 && player.regenBurst) rate += player.regenBurst;
            player.hp = Math.min(player.maxHp, player.hp+Math.floor(player.maxHp*rate));
        }
        // Boss中毒/灼烧
        if(boss){
            if(boss.poisoned>0){ boss.hp-=boss.poisonDmg||2; boss.poisoned--; }
            if(boss.burning>0){ boss.hp-=boss.burnDmg||3; boss.burning--; }
            if(boss.hp<=0) bossTakeDamage(1);
        }
        update();
        draw();
        updateProgress();
    }
    requestAnimationFrame(loop);
}

function update(){
    if(gameState!=='playing') return;
    // 玩家移动
    if(keys['ArrowLeft']||keys['a']||keys['A']) player.x-=10;
    if(keys['ArrowRight']||keys['d']||keys['D']) player.x+=10;
    let distToInput = inputX-player.x;
    if(Math.abs(distToInput)>2) player.x += distToInput*0.15;
    player.x = Math.max(player.radius, Math.min(W-player.radius, player.x));
    document.getElementById('player-hp-fill').style.width = (Math.max(0,player.hp/player.maxHp)*100)+'%';
    if(player.hp/player.maxHp<0.3) document.getElementById('player-hp-fill').style.background='linear-gradient(90deg,#ff0000,#ff6600)';

    if(boss) boss.update();

    // 射击 - 垂直向上
    if(player.fireTimer>0) player.fireTimer--;
    else {
        player.fireTimer = player.fireRate;
        let spread = player.bulletCount>1 ? 0.12 : 0;
        for(let i=0; i<player.bulletCount; i++){
            let angle = -Math.PI/2 + (i-(player.bulletCount-1)/2)*spread;
            let b = {
                x:player.x, y:player.y, vx:Math.cos(angle)*14, vy:Math.sin(angle)*14,
                dmg:player.damage, color:'#00ffff', pierce:player.pierce, life:10,
                explode:player.hasExplode, freeze:player.hasFreeze, lightning:player.hasLightning,
                poison:player.hasPoison, burn:player.hasBurn, split:player.hasSplit,
                homing:player.hasHoming, bounce:player.hasBounce, aoe:player.hasAOE
            };
            if(player.weapon?.effect?.splitChance && Math.random()<player.weapon.effect.splitChance){
                b.split = true; b.splitCount = player.splitCount || 1;
            }
            bullets.push(b);
        }
    }

    // 天使
    if(player.hasAngel && angels.length<player.angelCount) angels.push({x:W/2,y:H/2,timer:0});
    angels.forEach(a => {
        a.timer++; a.x=W/2+Math.sin(a.timer*0.03)*150; a.y=H/3+Math.cos(a.timer*0.04)*100;
        if(a.timer%20===0 && boss){
            let tx=boss.headX||W/2, ty=boss.headY||H/3;
            let angelDmg = player.damage*0.3 * (player.angelDmg||1);
            bullets.push({x:a.x,y:a.y,vx:(tx-a.x)*0.06,vy:(ty-a.y)*0.06,dmg:angelDmg,color:'#ffff00',pierce:0,life:10});
        }
    });

    // 子弹
    for(let i=bullets.length-1;i>=0;i--){
        let b=bullets[i];
        if(b.homing && boss){
            let tx=boss.headX, ty=boss.headY;
            let ta=Math.atan2(ty-b.y,tx-b.x), ca=Math.atan2(b.vy,b.vx);
            let diff=ta-ca; while(diff>Math.PI)diff-=Math.PI*2; while(diff<-Math.PI)diff+=Math.PI*2;
            ca+=diff*0.1; let spd=Math.hypot(b.vx,b.vy); 
            if(player.homingSpeed) spd *= player.homingSpeed;
            b.vx=Math.cos(ca)*spd; b.vy=Math.sin(ca)*spd;
        }
        b.x+=b.vx; b.y+=b.vy;
        particles.push({x:b.x,y:b.y,vx:0,vy:0,life:5,color:b.color,size:2});
        if(b.bounce){
            let maxBounce = player.bounceCount || 2;
            b.bounces = b.bounces || 0;
            if(b.x<0||b.x>W){b.vx*=-1;b.x=Math.max(0,Math.min(W,b.x));b.bounces++;}
            if(b.y<0){b.vy*=-1;b.y=0;b.bounces++;}
            if(b.bounces>=maxBounce){bullets.splice(i,1);continue;}
        } else if(b.x<0||b.x>W||b.y<0||b.y>H){bullets.splice(i,1);continue;}

        if(!boss) { bullets.splice(i,1); continue; }

        // 碰撞 - 先检查宝箱段（蛇身上）
        let hitChest = false;
        for(let ci=0; ci<boss.chestSegments.length; ci++){
            let segIdx = boss.chestSegments[ci];
            if(segIdx >= boss.segments.length) continue;
            let seg = boss.segments[segIdx];
            if(!seg || !seg.alive) continue;
            let dChest = Math.hypot(b.x-seg.x, b.y-seg.y);
            if(dChest < boss.radius + 5){
                // 宝箱段被击中！直接从蛇身上移除
                seg.alive = false;
                boss.chestSegments.splice(ci, 1);
                hitChest = true;
                // 特效
                for(let k=0;k<8;k++) particles.push({x:seg.x,y:seg.y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,color:'#ffcc00',size:4});
                // 暂停，弹出3选1
                bullets.splice(i, 1);
                showSkillSelect('🎁 宝箱击破! 选择词条');
                return;
            }
        }

        // 碰撞Boss头部
        let hitHead = Math.hypot(b.x-boss.headX, b.y-boss.headY) < boss.radius*2;
        if(hitHead){
            let dmg = b.dmg;
            if(player.homingDmg) dmg *= player.homingDmg;
            boss.takeDamage(dmg);
            // 特效
            if(b.explode){ 
                let r = player.explodeRadius || 40;
                for(let k=0;k<12;k++)particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:15,color:'#ff6600',size:5}); 
                boss.takeDamage(b.dmg*(player.explodeDmg||0.3)); 
            }
            if(b.freeze && boss.speed) boss.speed *= (player.freezeSlow || 0.95);
            hitChest = false; // 已命中头部
        }

        // 碰撞身体段
        if(!hitHead){
            for(let s=0; s<boss.segments.length; s+=4){
                let seg=boss.segments[s];
                if(!seg || !seg.alive) continue;
                let dSeg = Math.hypot(b.x-seg.x, b.y-seg.y);
                if(dSeg < boss.radius){
                    boss.takeDamage(b.dmg*0.5);
                    seg.alive = false;
                    hitHead = true; break;
                }
            }
        }

        if(hitHead){
            b.pierce--;
            if(b.pierce<0){bullets.splice(i,1);continue;}
        }
    }
    // 粒子
    for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1);}
    // 数字
    for(let i=damageNums.length-1;i>=0;i--){let d=damageNums[i];d.y+=d.vy;d.life--;if(d.life<=0)damageNums.splice(i,1);}
    if(screenShake>0) screenShake*=0.9; if(screenShake<0.5) screenShake=0;
}

function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(screenShake>0) ctx.translate((Math.random()-0.5)*screenShake*5, (Math.random()-0.5)*screenShake*5);
    ctx.strokeStyle='rgba(255,0,50,0.05)'; ctx.lineWidth=2;
    for(let i=0;i<W;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
    if(boss) boss.draw();
    angels.forEach(a=>{ctx.font='40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('👼',a.x,a.y);ctx.beginPath();ctx.arc(a.x,a.y,30,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fill();});
    drawPlayer();
    bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fillStyle=b.color;ctx.shadowBlur=10;ctx.shadowColor=b.color;ctx.fill();ctx.shadowBlur=0;});
    damageNums.forEach(d=>{ctx.fillStyle=d.color;ctx.font=`bold ${d.size}px Arial`;ctx.fillText(d.val,d.x,d.y);});
    particles.forEach(p=>{ctx.globalAlpha=p.life/20;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.globalAlpha=1;});
    ctx.restore();
}

// ========== 初始化 ==========
initMenu();
checkOffline();
</script>
