<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
<title>看谁能打过 - 弹射打龙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;font-family:sans-serif;color:#fff}
#score{position:absolute;top:10px;left:10px;font-size:20px}
#hp{position:absolute;bottom:10px;left:10%;width:80%;height:10px;background:#333}
#hp-fill{height:100%;width:100%;background:#0f0}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
    <div id="score">Score: 0</div>
    <div id="hp"><div id="hp-fill"></div></div>
</div>
<script>
var c = document.getElementById('c');
var x = c.getContext('2d');
var w, h;

function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

var p = { x: w/2, y: h-50, r: 20, hp: 100, maxHp: 100 };
var bullets = [];
var boss = { x: w/2, y: 100, r: 30, hp: 1000, maxHp: 1000, alive: true, segs: [] };

for(var i=0; i<20; i++) boss.segs.push({x:w/2, y:100-i*10, r:20, hp:100, hit:0});

var mx = w/2;
c.addEventListener('mousemove', e => mx = e.clientX);
c.addEventListener('touchmove', e => { if(e.touches[0]) mx = e.touches[0].clientX; }, {passive:true});

function loop() {
    // Update Player
    p.x += (mx - p.x) * 0.1;
    
    // Fire
    if (Math.random() < 0.1) {
        bullets.push({x: p.x, y: p.y, vx: 0, vy: -10, life: 100});
    }
    
    // Update Bullets
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        b.x += b.vx; b.y += b.vy; b.life--;
        
        // Bounce
        if (b.x < 0 || b.x > w) b.vx *= -1;
        if (b.y < 0) b.vy *= -1;
        
        // Hit Boss
        if (boss.alive) {
            for (var s of boss.segs) {
                var d = Math.sqrt((b.x-s.x)**2 + (b.y-s.y)**2);
                if (d < s.r + 5) {
                    s.hp -= 10; boss.hp -= 10; s.hit = 5;
                    b.life = 0;
                    if (boss.hp <= 0) {
                        boss.hp = 0;
                        boss.alive = false;
                        setTimeout(function(){ boss.alive=true; boss.hp=1000; }, 1000);
                    }
                }
            }
        }
        
        if (b.life <= 0) bullets.splice(i, 1);
    }
    
    // Draw
    x.fillStyle = '#111'; x.fillRect(0,0,w,h);
    
    // Boss
    if (boss.alive) {
        for (var s of boss.segs) {
            x.fillStyle = s.hit > 0 ? '#fff' : '#0f0';
            x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI*2); x.fill();
            if (s.hit > 0) s.hit--;
        }
        // Boss Head
        x.fillStyle = '#f00';
        x.beginPath(); x.arc(boss.x, boss.y, boss.r, 0, Math.PI*2); x.fill();
    }
    
    // Player
    x.fillStyle = '#0ff';
    x.beginPath(); x.arc(p.x, p.y, p.r, 0, Math.PI*2); x.fill();
    
    // Bullets
    x.fillStyle = '#ff0';
    for (var b of bullets) {
        x.beginPath(); x.arc(b.x, b.y, 4, 0, Math.PI*2); x.fill();
    }
    
    // UI
    document.getElementById('score').textContent = 'Score: ' + Math.floor(1000 - boss.hp);
    document.getElementById('hp-fill').style.width = (p.hp / p.maxHp * 100) + '%';
    
    // Auto resize to ensure touch works
    if (c.width !== window.innerWidth) resize();
    
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
